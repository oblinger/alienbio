<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1360" viewBox="0 0 1200 680" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <polygon id="arrowhead-shape" points="0,0 10,5 0,10" fill="#1e1e1e"/>
    </marker>
  </defs>
  <rect id="bg" x="0" y="0" width="1200" height="680" fill="#ffffff"/>
  <g id="n-env1">
    <rect id="n-env1-box" x="20" y="40" width="240" height="70" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-env1-name" x="140.0" y="68" font-size="18" font-weight="600" text-anchor="middle">ANTHROPIC_API_KEY</text>
    <text id="n-env1-kind" x="140.0" y="92" font-size="14" text-anchor="middle">(env) from the Keychain via ~/.zshrc</text>
  </g>
  <g id="n-env2">
    <rect id="n-env2-box" x="20" y="160" width="240" height="70" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-env2-name" x="140.0" y="188" font-size="18" font-weight="600" text-anchor="middle">ALIENBIO_&lt;P&gt;_API_KEY</text>
    <text id="n-env2-kind" x="140.0" y="212" font-size="14" text-anchor="middle">(env) the generic name</text>
  </g>
  <g id="n-file">
    <rect id="n-file-box" x="20" y="300" width="240" height="90" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-file-name" x="140.0" y="328" font-size="18" font-weight="600" text-anchor="middle">config.yaml</text>
    <text id="n-file-kind" x="140.0" y="352" font-size="14" text-anchor="middle">(file) ~/.config/alienbio, 0600</text>
    <text id="n-file-kind2" x="140.0" y="370" font-size="14" text-anchor="middle">api_keys: provider → key</text>
  </g>
  <g id="n-gak">
    <rect id="n-gak-box" x="320" y="160" width="240" height="70" rx="10" fill="#bac8ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-gak-name" x="440.0" y="188" font-size="18" font-weight="600" text-anchor="middle">get_api_key</text>
    <text id="n-gak-kind" x="440.0" y="212" font-size="14" text-anchor="middle">(fn) first non-empty wins</text>
  </g>
  <g id="n-llm">
    <rect id="n-llm-box" x="620" y="160" width="240" height="70" rx="10" fill="#f3f0ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-llm-name" x="740.0" y="188" font-size="18" font-weight="600" text-anchor="middle">LLMAgent provider fn</text>
    <text id="n-llm-kind" x="740.0" y="212" font-size="14" text-anchor="middle">(suite.llm_agent) the one caller</text>
  </g>
  <g id="n-snap">
    <rect id="n-snap-box" x="920" y="160" width="240" height="70" rx="10" fill="#f3f0ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-snap-name" x="1040.0" y="188" font-size="18" font-weight="600" text-anchor="middle">fetch_models_snapshot</text>
    <text id="n-snap-kind" x="1040.0" y="212" font-size="14" text-anchor="middle">(suite.llm_agent) bio suite models</text>
  </g>
  <g id="n-load">
    <rect id="n-load-box" x="320" y="320" width="240" height="70" rx="10" fill="#bac8ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-load-name" x="440.0" y="348" font-size="18" font-weight="600" text-anchor="middle">load_config</text>
    <text id="n-load-kind" x="440.0" y="372" font-size="14" text-anchor="middle">(fn) merged onto DEFAULT_CONFIG</text>
  </g>
  <g id="n-save">
    <rect id="n-save-box" x="320" y="490" width="240" height="70" rx="10" fill="#bac8ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-save-name" x="440.0" y="518" font-size="18" font-weight="600" text-anchor="middle">save_config</text>
    <text id="n-save-kind" x="440.0" y="542" font-size="14" text-anchor="middle">(fn) rewrite the whole file</text>
  </g>
  <g id="n-cmd">
    <rect id="n-cmd-box" x="620" y="320" width="240" height="90" rx="10" fill="#bac8ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-cmd-name" x="740.0" y="348" font-size="18" font-weight="600" text-anchor="middle">config_command</text>
    <text id="n-cmd-kind" x="740.0" y="372" font-size="14" text-anchor="middle">(bio config) argparse</text>
    <text id="n-cmd-kind2" x="740.0" y="390" font-size="14" text-anchor="middle">set-key · list-keys · show · …</text>
  </g>
  <g id="n-defs">
    <rect id="n-defs-box" x="920" y="320" width="240" height="70" rx="10" fill="#f3f0ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-defs-name" x="1040.0" y="348" font-size="18" font-weight="600" text-anchor="middle">PINNED_MODEL</text>
    <text id="n-defs-kind" x="1040.0" y="372" font-size="14" text-anchor="middle">(suite.llm_agent) the ping's model</text>
  </g>
  <g id="n-tak">
    <rect id="n-tak-box" x="620" y="490" width="240" height="70" rx="10" fill="#bac8ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-tak-name" x="740.0" y="518" font-size="18" font-weight="600" text-anchor="middle">check_api_key</text>
    <text id="n-tak-kind" x="740.0" y="542" font-size="14" text-anchor="middle">(fn) one billed call on anthropic</text>
  </g>
  <g id="n-prov">
    <rect id="n-prov-box" x="920" y="490" width="240" height="70" rx="10" fill="#f3f0ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-prov-name" x="1040.0" y="518" font-size="18" font-weight="600" text-anchor="middle">provider API</text>
    <text id="n-prov-kind" x="1040.0" y="542" font-size="14" text-anchor="middle">(network) messages.create</text>
  </g>
  <line id="e-env1-gak" x1="260" y1="75" x2="370" y2="160" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text id="l-env1-gak" x="320" y="105" font-size="14" fill="#1971c2" font-style="italic" text-anchor="start">1st</text>
  <line id="e-env2-gak" x1="260" y1="195" x2="320" y2="195" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text id="l-env2-gak" x="290" y="185" font-size="14" fill="#1971c2" font-style="italic" text-anchor="middle">2nd</text>
  <line id="e-file-load" x1="260" y1="345" x2="320" y2="345" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line id="e-load-gak" x1="440" y1="320" x2="440" y2="230" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text id="l-load-gak" x="450" y="280" font-size="14" fill="#1971c2" font-style="italic" text-anchor="start">3rd</text>
  <line id="e-gak-llm" x1="560" y1="195" x2="620" y2="195" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <polyline id="e-gak-snap" points="520,160 520,140 1040,140 1040,160" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <line id="e-cmd-load" x1="620" y1="365" x2="560" y2="365" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line id="e-save-file" x1="360" y1="490" x2="200" y2="390" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line id="e-tak-defs" x1="840" y1="490" x2="960" y2="390" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <text id="l-tak-defs" x="912" y="452" font-size="14" fill="#1971c2" font-style="italic" text-anchor="start">model</text>
  <line id="e-cmd-tak" x1="740" y1="410" x2="740" y2="490" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text id="l-cmd-tak" x="750" y="455" font-size="14" fill="#1971c2" font-style="italic" text-anchor="start">test-key</text>
  <line id="e-tak-prov" x1="860" y1="525" x2="920" y2="525" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line id="e-cmd-save" x1="640" y1="410" x2="560" y2="490" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text id="l-cmd-save" x="590" y="448" font-size="14" fill="#1971c2" font-style="italic" text-anchor="end">set-key</text>
  <text id="t-legend" x="20" y="640" font-size="13" fill="#495057" text-anchor="start" xml:space="preserve">solid: read or call · dotted: copies, names · no default agent or model setting: a run's model is its spec's or PINNED_MODEL</text>
  <text id="t-legend2" x="20" y="660" font-size="13" fill="#495057" text-anchor="start" xml:space="preserve">an empty `api_keys:` reads as no keys; a looser file is tightened to 0600 on read</text>
</svg>
