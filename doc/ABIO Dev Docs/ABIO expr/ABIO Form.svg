<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1360" viewBox="0 0 1200 680" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <polygon id="arrowhead-shape" points="0,0 10,5 0,10" fill="#1e1e1e"/>
    </marker>
  </defs>
  <rect id="bg" x="0" y="0" width="1200" height="680" fill="#ffffff"/>

  <g id="n-x">
    <rect id="n-x-box" x="20" y="70" width="250" height="80" rx="10" fill="#f3f0ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-x-name" x="145" y="96" font-size="18" font-weight="600" text-anchor="middle">X</text>
    <text id="n-x-kind" x="145" y="118" font-size="14" text-anchor="middle">(x._X) X.head(...) · X.name</text>
    <text id="n-x-kind2" x="145" y="138" font-size="14" text-anchor="middle">X.quote · X.call</text>
  </g>
  <g id="n-parse">
    <rect id="n-parse-box" x="20" y="230" width="250" height="70" rx="10" fill="#f3f0ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-parse-name" x="145" y="258" font-size="18" font-weight="600" text-anchor="middle">parse</text>
    <text id="n-parse-kind" x="145" y="282" font-size="14" text-anchor="middle">(Parse) inline text</text>
  </g>
  <g id="n-load">
    <rect id="n-load-box" x="20" y="390" width="250" height="70" rx="10" fill="#f3f0ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-load-name" x="145" y="418" font-size="18" font-weight="600" text-anchor="middle">load_text</text>
    <text id="n-load-kind" x="145" y="442" font-size="14" text-anchor="middle">(YamlTags) structural YAML</text>
  </g>

  <g id="n-tree">
    <rect id="n-tree-box" x="360" y="30" width="330" height="560" rx="14" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text id="n-tree-name" x="525" y="56" font-size="16" font-weight="600" text-anchor="middle">form tree (data holding these)</text>
  </g>
  <g id="n-name">
    <rect id="n-name-box" x="390" y="80" width="270" height="64" rx="10" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-name-name" x="525" y="106" font-size="18" font-weight="600" text-anchor="middle">Name</text>
    <text id="n-name-kind" x="525" y="128" font-size="14" text-anchor="middle">(dataclass) path</text>
  </g>
  <g id="n-call">
    <rect id="n-call-box" x="390" y="180" width="270" height="80" rx="10" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-call-name" x="525" y="206" font-size="18" font-weight="600" text-anchor="middle">Call ‡</text>
    <text id="n-call-kind" x="525" y="228" font-size="14" text-anchor="middle">(dataclass) head · args tuple</text>
    <text id="n-call-kind2" x="525" y="248" font-size="14" text-anchor="middle">kwargs dict</text>
  </g>
  <g id="n-quoted">
    <rect id="n-quoted-box" x="390" y="296" width="270" height="64" rx="10" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-quoted-name" x="525" y="322" font-size="18" font-weight="600" text-anchor="middle">Quoted</text>
    <text id="n-quoted-kind" x="525" y="344" font-size="14" text-anchor="middle">(dataclass) form, held</text>
  </g>
  <g id="n-inc">
    <rect id="n-inc-box" x="390" y="470" width="270" height="80" rx="10" fill="#fff4e6" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-inc-name" x="525" y="496" font-size="18" font-weight="600" text-anchor="middle">Include · PyRef</text>
    <text id="n-inc-kind" x="525" y="518" font-size="14" text-anchor="middle">(dataclass) path; load-time</text>
    <text id="n-inc-kind2" x="525" y="538" font-size="14" text-anchor="middle">only, never evaluated</text>
  </g>

  <line id="e-x-tree" x1="270" y1="110" x2="360" y2="110" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line id="e-parse-tree" x1="270" y1="265" x2="360" y2="265" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line id="e-load-tree" x1="270" y1="425" x2="360" y2="425" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <polyline id="e-load-inc" points="145,460 145,510 390,510" fill="none" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text id="l-load-inc" x="155" y="500" font-size="14" fill="#1971c2" font-style="italic">!include · !py</text>

  <g id="n-walk">
    <rect id="n-walk-box" x="800" y="80" width="380" height="80" rx="10" fill="#bac8ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-walk-name" x="990" y="106" font-size="18" font-weight="600" text-anchor="middle">walk · is_form · contains_form</text>
    <text id="n-walk-kind" x="990" y="128" font-size="14" text-anchor="middle">(fn) pre-order nodes; tagged or</text>
    <text id="n-walk-kind2" x="990" y="148" font-size="14" text-anchor="middle">still needing evaluation</text>
  </g>
  <line id="e-walk-tree" x1="800" y1="120" x2="690" y2="120" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <text id="l-walk-tree" x="745" y="110" font-size="14" fill="#1971c2" font-style="italic" text-anchor="middle">reads</text>
  <g id="n-eval">
    <rect id="n-eval-box" x="800" y="260" width="380" height="80" rx="10" fill="#f3f0ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-eval-name" x="990" y="286" font-size="18" font-weight="600" text-anchor="middle">evaluate</text>
    <text id="n-eval-kind" x="990" y="308" font-size="14" text-anchor="middle">(Interp) gives Name, Call and</text>
    <text id="n-eval-kind2" x="990" y="328" font-size="14" text-anchor="middle">Quoted their meaning</text>
  </g>
  <line id="e-tree-eval" x1="690" y1="300" x2="800" y2="300" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text id="l-tree-eval" x="745" y="290" font-size="14" fill="#1971c2" font-style="italic" text-anchor="middle">after load</text>
  <g id="n-hyd">
    <rect id="n-hyd-box" x="800" y="470" width="380" height="80" rx="10" fill="#f3f0ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-hyd-name" x="990" y="496" font-size="18" font-weight="600" text-anchor="middle">hydrate</text>
    <text id="n-hyd-kind" x="990" y="518" font-size="14" text-anchor="middle">(Include) replaces each with the file</text>
    <text id="n-hyd-kind2" x="990" y="538" font-size="14" text-anchor="middle">or object it names, under trust</text>
  </g>
  <line id="e-inc-hyd" x1="660" y1="510" x2="800" y2="510" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text id="l-inc-hyd" x="745" y="500" font-size="14" fill="#1971c2" font-style="italic" text-anchor="middle">resolved by</text>

  <g id="legend">
    <rect id="legend-box" x="15" y="615" width="1170" height="52" rx="8" fill="#ffffff" stroke="#868e96" stroke-width="1"/>
    <line id="legend-solid" x1="35" y1="641" x2="85" y2="641" stroke="#1e1e1e" stroke-width="3"/>
    <text id="legend-solid-text" x="95" y="646" font-size="14">builds, consumes</text>
    <line id="legend-dotted" x1="240" y1="641" x2="290" y2="641" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4"/>
    <text id="legend-dotted-text" x="300" y="646" font-size="14">reads</text>
    <text id="legend-dagger" x="380" y="646" font-size="14">‡ frozen but unhashable, and its kwargs dict is mutable in place; the other four hash</text>
  </g>
</svg>
