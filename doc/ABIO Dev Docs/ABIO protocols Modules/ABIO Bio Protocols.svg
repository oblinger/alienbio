  <text id="t-legend" x="20" y="655" font-size="13" fill="#495057" text-anchor="start" xml:space="preserve">solid: check, typing, use · dotted: assignment, re-export · Flow, GeneralFlow and Simulator name WorldStateImpl / CompartmentTreeImpl</text>
  <text id="t-legend2" x="20" y="673" font-size="13" fill="#495057" text-anchor="start" xml:space="preserve">a runtime isinstance sees member names only; the type check is pyright's</text>
