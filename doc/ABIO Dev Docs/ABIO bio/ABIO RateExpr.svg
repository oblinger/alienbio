<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1360" viewBox="0 0 1200 680" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <polygon id="arrowhead-shape" points="0,0 10,5 0,10" fill="#1e1e1e"/>
    </marker>
  </defs>
  <rect id="bg" x="0" y="0" width="1200" height="680" fill="#ffffff"/>

  <!-- Row A: text to tree -->
  <g id="n-law">
    <rect id="n-law-box" x="20" y="40" width="180" height="76" rx="10" fill="#fff3f3" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-law-name" x="110" y="72" font-size="18" font-weight="600" text-anchor="middle">rate law</text>
    <text id="n-law-kind" x="110" y="96" font-size="14" text-anchor="middle">(Expr grammar text)</text>
  </g>
  <g id="n-compile">
    <rect id="n-compile-box" x="290" y="40" width="220" height="76" rx="10" fill="#f1f3f5" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-compile-name" x="400" y="72" font-size="18" font-weight="600" text-anchor="middle">compile_rate</text>
    <text id="n-compile-kind" x="400" y="96" font-size="14" text-anchor="middle">(fn, suite/rate_law.py)</text>
  </g>
  <g id="n-reaction">
    <rect id="n-reaction-box" x="610" y="40" width="210" height="76" rx="10" fill="#f1f3f5" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-reaction-name" x="715" y="72" font-size="18" font-weight="600" text-anchor="middle">ReactionImpl</text>
    <text id="n-reaction-kind" x="715" y="96" font-size="14" text-anchor="middle">(class) .rate_law</text>
  </g>
  <g id="n-map">
    <rect id="n-map-box" x="930" y="40" width="250" height="76" rx="10" fill="#f1f3f5" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-map-name" x="1055" y="72" font-size="18" font-weight="600" text-anchor="middle">map_species</text>
    <text id="n-map-kind" x="1055" y="96" font-size="14" text-anchor="middle">(fn) names → molecule ids</text>
  </g>
  <line id="e-compile" x1="200" y1="78" x2="290" y2="78" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text id="e-compile-label" x="245" y="66" font-size="14" fill="#1971c2" font-style="italic" text-anchor="middle">compile</text>
  <line id="e-realize" x1="510" y1="78" x2="610" y2="78" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text id="e-realize-label" x="560" y="66" font-size="14" fill="#1971c2" font-style="italic" text-anchor="middle">realize</text>
  <line id="e-build" x1="820" y1="78" x2="930" y2="78" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text id="e-build-label" x="875" y="66" font-size="14" fill="#1971c2" font-style="italic" text-anchor="middle">spec build</text>

  <!-- Row B: the tree and its readers -->
  <g id="n-tree">
    <rect id="n-tree-box" x="400" y="230" width="340" height="90" rx="10" fill="#fff9db" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-tree-name" x="570" y="266" font-size="18" font-weight="600" text-anchor="middle">RateNode tree</text>
    <text id="n-tree-kind" x="570" y="292" font-size="14" text-anchor="middle">(tuple) const · species · mod · ops</text>
  </g>
  <path id="e-ids" d="M1055,116 L1055,190 L700,190 L700,230" fill="none" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text id="e-ids-label" x="880" y="180" font-size="14" fill="#1971c2" font-style="italic" text-anchor="middle">species by id</text>
  <g id="n-implicit">
    <rect id="n-implicit-box" x="30" y="236" width="250" height="78" rx="10" fill="#f1f3f5" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-implicit-name" x="155" y="268" font-size="18" font-weight="600" text-anchor="middle">implicit_mass_action</text>
    <text id="n-implicit-kind" x="155" y="292" font-size="14" text-anchor="middle">(fn) names a reactant?</text>
  </g>
  <line id="e-implicit" x1="400" y1="275" x2="280" y2="275" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3,5" marker-end="url(#arrowhead)"/>
  <text id="e-implicit-label" x="340" y="263" font-size="14" fill="#1971c2" font-style="italic" text-anchor="middle">reads</text>
  <g id="n-json">
    <rect id="n-json-box" x="850" y="236" width="320" height="78" rx="10" fill="#f1f3f5" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-json-name" x="1010" y="268" font-size="18" font-weight="600" text-anchor="middle">to_json · from_json · to_text</text>
    <text id="n-json-kind" x="1010" y="292" font-size="14" text-anchor="middle">(fns) lists and inline text</text>
  </g>
  <line id="e-json" x1="740" y1="275" x2="850" y2="275" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3,5" marker-end="url(#arrowhead)"/>
  <text id="e-json-label" x="795" y="263" font-size="14" fill="#1971c2" font-style="italic" text-anchor="middle">serialize</text>

  <!-- Row C: two evaluators -->
  <g id="n-eval">
    <rect id="n-eval-box" x="270" y="410" width="280" height="96" rx="10" fill="#dbe4ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-eval-name" x="410" y="440" font-size="18" font-weight="600" text-anchor="middle">eval_rate</text>
    <text id="n-eval-kind" x="410" y="464" font-size="14" text-anchor="middle">(fn) one Python float</text>
    <text id="n-eval-note" x="410" y="488" font-size="14" fill="#a61e4d" text-anchor="middle">div: |b| &lt; ROUNDING_FLOOR → 0</text>
  </g>
  <g id="n-jax">
    <rect id="n-jax-box" x="600" y="410" width="280" height="96" rx="10" fill="#dbe4ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-jax-name" x="740" y="440" font-size="18" font-weight="600" text-anchor="middle">lower_jax</text>
    <text id="n-jax-kind" x="740" y="464" font-size="14" text-anchor="middle">(fn) jnp ops → [C] array</text>
    <text id="n-jax-note" x="740" y="488" font-size="14" fill="#a61e4d" text-anchor="middle">div: |b| &lt; ROUNDING_FLOOR → 0</text>
  </g>
  <line id="e-ref" x1="520" y1="320" x2="430" y2="410" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text id="e-ref-label" x="462" y="360" font-size="14" fill="#1971c2" font-style="italic" text-anchor="end">reference</text>
  <line id="e-lower" x1="620" y1="320" x2="710" y2="410" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text id="e-lower-label" x="678" y="360" font-size="14" fill="#1971c2" font-style="italic" text-anchor="start">traced under jit</text>
  <g id="n-modf">
    <rect id="n-modf-box" x="20" y="420" width="190" height="76" rx="10" fill="#f1f3f5" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-modf-name" x="115" y="452" font-size="18" font-weight="600" text-anchor="middle">modulation_factor</text>
    <text id="n-modf-kind" x="115" y="476" font-size="14" text-anchor="middle">(fn) four kinds</text>
  </g>
  <line id="e-modf" x1="270" y1="458" x2="210" y2="458" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3,5" marker-end="url(#arrowhead)"/>
  <text id="e-modf-label" x="240" y="446" font-size="14" fill="#1971c2" font-style="italic" text-anchor="middle">mod</text>

  <!-- Row D: two simulators -->
  <g id="n-wsi">
    <rect id="n-wsi-box" x="270" y="560" width="280" height="76" rx="10" fill="#ebfbee" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-wsi-name" x="410" y="590" font-size="18" font-weight="600" text-anchor="middle">WorldSimulatorImpl</text>
    <text id="n-wsi-kind" x="410" y="614" font-size="14" fill="#a61e4d" text-anchor="middle">(class) clamp [0, RATE_CAP]</text>
  </g>
  <g id="n-core">
    <rect id="n-core-box" x="630" y="560" width="220" height="76" rx="10" fill="#ebfbee" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-core-name" x="740" y="590" font-size="18" font-weight="600" text-anchor="middle">jax_core</text>
    <text id="n-core-kind" x="740" y="614" font-size="14" fill="#a61e4d" text-anchor="middle">(module) min(·, RATE_CAP)</text>
  </g>
  <line id="e-wsi" x1="410" y1="506" x2="410" y2="560" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text id="e-wsi-label" x="420" y="538" font-size="14" fill="#1971c2" font-style="italic" text-anchor="start">rate</text>
  <line id="e-core" x1="740" y1="506" x2="740" y2="560" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text id="e-core-label" x="750" y="538" font-size="14" fill="#1971c2" font-style="italic" text-anchor="start">rates</text>
  <line id="e-parity" x1="550" y1="598" x2="630" y2="598" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3,5"/>
  <text id="e-parity-label" x="590" y="586" font-size="14" fill="#1971c2" font-style="italic" text-anchor="middle">parity</text>

  <!-- Legend -->
  <g id="legend">
    <line id="lg-solid" x1="20" y1="664" x2="74" y2="664" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text id="lg-solid-text" x="84" y="669" font-size="14">primary flow</text>
    <line id="lg-dot" x1="200" y1="664" x2="254" y2="664" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3,5" marker-end="url(#arrowhead)"/>
    <text id="lg-dot-text" x="264" y="669" font-size="14">reads · calls · serializes</text>
    <text id="lg-const" x="480" y="669" font-size="14" fill="#a61e4d">red text: where ROUNDING_FLOOR / RATE_CAP apply</text>
  </g>
</svg>
