<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1360" viewBox="0 0 1200 680" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="#1e1e1e"/>
    </marker>
    <marker id="arrowhead-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="#c92a2a"/>
    </marker>
  </defs>
  <rect id="background" x="0" y="0" width="1200" height="680" fill="#ffffff"/>

  <!-- Top row: one step, frozen input to written copy -->
  <g id="world-node">
    <rect id="world-box" x="20" y="50" width="160" height="90" rx="10" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/>
    <text id="world-name" x="100" y="90" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e1e1e">WorldImpl</text>
    <text id="world-kind" x="100" y="114" font-size="14" text-anchor="middle" fill="#1e1e1e">(class) · builder</text>
  </g>
  <g id="frozen-node">
    <rect id="frozen-box" x="290" y="50" width="200" height="90" rx="10" fill="#dbe4ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="frozen-name" x="390" y="90" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e1e1e">WorldStateImpl</text>
    <text id="frozen-kind" x="390" y="114" font-size="14" text-anchor="middle" fill="#1e1e1e">(instance) · frozen input</text>
  </g>
  <g id="step-node">
    <rect id="step-box" x="560" y="50" width="260" height="90" rx="10" fill="#e6fcf5" stroke="#1e1e1e" stroke-width="2"/>
    <text id="step-name" x="690" y="82" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e1e1e">WorldSimulatorImpl.step</text>
    <text id="step-kind" x="690" y="104" font-size="14" text-anchor="middle" fill="#1e1e1e">(method) · three passes</text>
    <text id="step-sub" x="690" y="124" font-size="14" text-anchor="middle" fill="#1e1e1e">flush subnormals, then copy</text>
  </g>
  <g id="new-node">
    <rect id="new-box" x="890" y="50" width="200" height="90" rx="10" fill="#dbe4ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="new-name" x="990" y="90" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e1e1e">WorldStateImpl</text>
    <text id="new-kind" x="990" y="114" font-size="14" text-anchor="middle" fill="#1e1e1e">(instance) · written copy</text>
  </g>

  <line id="edge-initial-state" x1="180" y1="95" x2="290" y2="95" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text id="label-initial-state" x="235" y="86" font-size="14" font-style="italic" text-anchor="middle" fill="#1864ab">initial_state</text>
  <line id="edge-reads" x1="490" y1="95" x2="560" y2="95" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowhead)"/>
  <text id="label-reads" x="525" y="86" font-size="14" font-style="italic" text-anchor="middle" fill="#1864ab">reads</text>
  <line id="edge-writes" x1="820" y1="95" x2="890" y2="95" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text id="label-writes" x="855" y="86" font-size="14" font-style="italic" text-anchor="middle" fill="#1864ab">writes</text>
  <path id="edge-copy" d="M390,50 V28 H990 V50" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowhead)"/>
  <text id="label-copy" x="690" y="21" font-size="14" font-style="italic" text-anchor="middle" fill="#1864ab">copy() at step start</text>

  <line id="edge-holds-frozen" x1="390" y1="140" x2="390" y2="185" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowhead)"/>
  <text id="label-holds-frozen" x="400" y="167" font-size="14" font-style="italic" fill="#1864ab">holds</text>
  <line id="edge-holds-new" x1="990" y1="140" x2="990" y2="185" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowhead)"/>
  <text id="label-holds-new" x="1000" y="167" font-size="14" font-style="italic" fill="#1864ab">holds</text>

  <!-- Middle: the storage one state holds -->
  <rect id="storage-box" x="300" y="185" width="800" height="315" rx="12" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
  <text id="storage-title" x="320" y="214" font-size="18" font-weight="bold" fill="#1e1e1e">WorldStateImpl (class) · what one state holds</text>

  <text id="conc-label" x="320" y="244" font-size="14" fill="#1e1e1e">_concentrations · List[float] · flat, row-major</text>
  <text id="comp0-label" x="425" y="264" font-size="14" text-anchor="middle" fill="#1e1e1e">compartment 0</text>
  <text id="comp1-label" x="635" y="264" font-size="14" text-anchor="middle" fill="#1e1e1e">compartment 1</text>
  <path id="comp0-bracket" d="M322,277 V271 H528 V277" fill="none" stroke="#1e1e1e" stroke-width="1.5"/>
  <path id="comp1-bracket" d="M532,277 V271 H738 V277" fill="none" stroke="#1e1e1e" stroke-width="1.5"/>
  <g id="conc-cells">
    <rect id="cell-c0m0" x="320" y="280" width="70" height="40" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
    <rect id="cell-c0m1" x="390" y="280" width="70" height="40" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
    <rect id="cell-c0m2" x="460" y="280" width="70" height="40" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
    <rect id="cell-c1m0" x="530" y="280" width="70" height="40" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
    <rect id="cell-c1m1" x="600" y="280" width="70" height="40" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
    <rect id="cell-c1m2" x="670" y="280" width="70" height="40" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
    <text id="text-c0m0" x="355" y="305" font-size="16" text-anchor="middle" fill="#1e1e1e">c0·m0</text>
    <text id="text-c0m1" x="425" y="305" font-size="16" text-anchor="middle" fill="#1e1e1e">c0·m1</text>
    <text id="text-c0m2" x="495" y="305" font-size="16" text-anchor="middle" fill="#1e1e1e">c0·m2</text>
    <text id="text-c1m0" x="565" y="305" font-size="16" text-anchor="middle" fill="#1e1e1e">c1·m0</text>
    <text id="text-c1m1" x="635" y="305" font-size="16" text-anchor="middle" fill="#1e1e1e">c1·m1</text>
    <text id="text-c1m2" x="705" y="305" font-size="16" text-anchor="middle" fill="#1e1e1e">c1·m2</text>
  </g>
  <text id="index-formula" x="760" y="297" font-size="14" fill="#1e1e1e">index = comp × num_molecules + mol</text>
  <text id="index-negative" x="760" y="317" font-size="14" fill="#c92a2a">a negative id wraps from the end</text>
  <path id="edge-overflow" d="M495,322 C505,352 555,352 565,324" fill="none" stroke="#c92a2a" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowhead-red)"/>
  <text id="label-overflow" x="530" y="368" font-size="14" fill="#c92a2a" text-anchor="middle">get(0, 3) lands in c1·m0, unchecked</text>

  <text id="mult-label" x="320" y="406" font-size="14" fill="#1e1e1e">_multiplicities</text>
  <rect id="cell-mult0" x="320" y="414" width="70" height="40" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <rect id="cell-mult1" x="390" y="414" width="70" height="40" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text id="text-mult0" x="355" y="439" font-size="16" text-anchor="middle" fill="#1e1e1e">c0</text>
  <text id="text-mult1" x="425" y="439" font-size="16" text-anchor="middle" fill="#1e1e1e">c1</text>
  <text id="vol-label" x="520" y="406" font-size="14" fill="#1e1e1e">_volumes</text>
  <rect id="cell-vol0" x="520" y="414" width="70" height="40" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <rect id="cell-vol1" x="590" y="414" width="70" height="40" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text id="text-vol0" x="555" y="439" font-size="16" text-anchor="middle" fill="#1e1e1e">c0</text>
  <text id="text-vol1" x="625" y="439" font-size="16" text-anchor="middle" fill="#1e1e1e">c1</text>
  <text id="ids-label" x="720" y="406" font-size="14" fill="#1e1e1e">compartment_ids · molecule_ids</text>
  <rect id="ids-box" x="720" y="414" width="360" height="40" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text id="ids-text" x="900" y="439" font-size="16" text-anchor="middle" fill="#1e1e1e">optional tuples · [i] names index i</text>
  <text id="amount-formula" x="320" y="484" font-size="14" fill="#1e1e1e">amount = multiplicity × volume × concentration · total_molecules omits volume</text>

  <!-- Left column: tree, writers -->
  <g id="tree-node">
    <rect id="tree-box" x="20" y="200" width="210" height="90" rx="10" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/>
    <text id="tree-name" x="125" y="236" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e1e1e">CompartmentTreeImpl</text>
    <text id="tree-kind" x="125" y="258" font-size="14" text-anchor="middle" fill="#1e1e1e">(class) · topology</text>
    <text id="tree-sub" x="125" y="278" font-size="14" text-anchor="middle" fill="#1e1e1e">shared by copies</text>
  </g>
  <line id="edge-tree" x1="300" y1="245" x2="230" y2="245" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowhead)"/>
  <text id="label-tree" x="265" y="236" font-size="14" font-style="italic" text-anchor="middle" fill="#1864ab">tree</text>

  <g id="intervene-node">
    <rect id="intervene-box" x="20" y="315" width="210" height="90" rx="10" fill="#ffe3e3" stroke="#1e1e1e" stroke-width="2"/>
    <text id="intervene-name" x="125" y="351" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e1e1e">Intervene</text>
    <text id="intervene-kind" x="125" y="373" font-size="14" text-anchor="middle" fill="#1e1e1e">(runner action)</text>
    <text id="intervene-sub" x="125" y="393" font-size="14" text-anchor="middle" fill="#1e1e1e">copy, set every compartment</text>
  </g>
  <line id="edge-intervene" x1="230" y1="360" x2="300" y2="360" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text id="label-intervene" x="265" y="351" font-size="14" font-style="italic" text-anchor="middle" fill="#1864ab">set</text>

  <g id="jax-node">
    <rect id="jax-box" x="20" y="420" width="210" height="90" rx="10" fill="#e6fcf5" stroke="#1e1e1e" stroke-width="2"/>
    <text id="jax-name" x="125" y="456" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e1e1e">JaxWorldSimulator</text>
    <text id="jax-kind" x="125" y="478" font-size="14" text-anchor="middle" fill="#1e1e1e">(class) · array S [C × M]</text>
    <text id="jax-sub" x="125" y="498" font-size="14" text-anchor="middle" fill="#1e1e1e">get / set_compartment</text>
  </g>
  <line id="edge-jax" x1="230" y1="465" x2="300" y2="465" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6 5" marker-start="url(#arrowhead)" marker-end="url(#arrowhead)"/>
  <text id="label-jax" x="265" y="456" font-size="14" font-style="italic" text-anchor="middle" fill="#1864ab">in / out</text>

  <!-- Bottom row: readers -->
  <g id="obs-node">
    <rect id="obs-box" x="300" y="545" width="185" height="80" rx="10" fill="#f3f0ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="obs-name" x="392" y="578" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e1e1e">full_observation</text>
    <text id="obs-kind" x="392" y="602" font-size="14" text-anchor="middle" fill="#1e1e1e">(function) · per turn</text>
  </g>
  <g id="readout-node">
    <rect id="readout-box" x="505" y="545" width="185" height="80" rx="10" fill="#f3f0ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="readout-name" x="597" y="578" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e1e1e">readout_values</text>
    <text id="readout-kind" x="597" y="602" font-size="14" text-anchor="middle" fill="#1e1e1e">(function) · summed</text>
  </g>
  <g id="final-node">
    <rect id="final-box" x="710" y="545" width="185" height="80" rx="10" fill="#f3f0ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="final-name" x="802" y="578" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e1e1e">final_state_dict</text>
    <text id="final-kind" x="802" y="602" font-size="14" text-anchor="middle" fill="#1e1e1e">(function) · the record</text>
  </g>
  <g id="rebuild-node">
    <rect id="rebuild-box" x="915" y="545" width="185" height="80" rx="10" fill="#f3f0ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="rebuild-name" x="1007" y="578" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e1e1e">_world_from_state</text>
    <text id="rebuild-kind" x="1007" y="602" font-size="14" text-anchor="middle" fill="#1e1e1e">(runner) · each turn</text>
  </g>
  <line id="edge-obs" x1="392" y1="500" x2="392" y2="545" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowhead)"/>
  <text id="label-obs" x="400" y="527" font-size="14" font-style="italic" fill="#1864ab">as_array</text>
  <line id="edge-readout" x1="597" y1="500" x2="597" y2="545" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowhead)"/>
  <text id="label-readout" x="605" y="527" font-size="14" font-style="italic" fill="#1864ab">get</text>
  <line id="edge-final" x1="802" y1="500" x2="802" y2="545" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowhead)"/>
  <text id="label-final" x="810" y="527" font-size="14" font-style="italic" fill="#1864ab">get</text>
  <line id="edge-rebuild" x1="1007" y1="500" x2="1007" y2="545" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowhead)"/>
  <text id="label-rebuild" x="1015" y="527" font-size="14" font-style="italic" fill="#1864ab">get_*</text>

  <!-- Legend -->
  <g id="legend">
    <line id="legend-solid" x1="20" y1="655" x2="70" y2="655" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text id="legend-solid-text" x="80" y="660" font-size="14" fill="#1e1e1e">builds / writes</text>
    <line id="legend-dotted" x1="200" y1="655" x2="250" y2="655" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowhead)"/>
    <text id="legend-dotted-text" x="260" y="660" font-size="14" fill="#1e1e1e">reads / holds / copies</text>
    <line id="legend-red" x1="440" y1="655" x2="490" y2="655" stroke="#c92a2a" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowhead-red)"/>
    <text id="legend-red-text" x="500" y="660" font-size="14" fill="#c92a2a">unchecked index (Storage layout and indexing)</text>
  </g>
</svg>
