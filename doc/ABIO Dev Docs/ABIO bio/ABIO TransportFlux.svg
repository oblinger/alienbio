<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1360" viewBox="0 0 1200 680" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="#1e1e1e"/>
    </marker>
  </defs>
  <rect id="background" x="0" y="0" width="1200" height="680" fill="#ffffff"/>

  <!-- apply_flows container -->
  <rect id="apply-flows-box" x="610" y="20" width="570" height="525" rx="12" fill="#f4f6ff" stroke="#3b5bdb" stroke-width="2"/>
  <text id="apply-flows-name" x="630" y="50" font-size="18" font-weight="700" fill="#1e1e1e">apply_flows</text>
  <text id="apply-flows-kind" x="742" y="50" font-size="14" fill="#343a40">(function, pass 2 of every step)</text>

  <!-- column A: authoring -->
  <rect id="blocks-box" x="20" y="30" width="220" height="90" rx="10" fill="#f1f3f5" stroke="#1e1e1e" stroke-width="2"/>
  <text id="blocks-name" x="130" y="58" font-size="18" font-weight="700" text-anchor="middle" fill="#1e1e1e">TransportBlock</text>
  <text id="blocks-sub1" x="130" y="80" font-size="14" text-anchor="middle" fill="#343a40">SpatialLatticeBlock</text>
  <text id="blocks-sub2" x="130" y="100" font-size="14" text-anchor="middle" fill="#343a40">!Transport (blocks, Expr)</text>

  <rect id="fragment-box" x="20" y="170" width="220" height="70" rx="10" fill="#f1f3f5" stroke="#1e1e1e" stroke-width="2"/>
  <text id="fragment-name" x="130" y="198" font-size="18" font-weight="700" text-anchor="middle" fill="#1e1e1e">Fragment</text>
  <text id="fragment-sub" x="130" y="222" font-size="14" text-anchor="middle" fill="#343a40">flows: tuple[Transport]</text>

  <rect id="worldimpl-box" x="20" y="290" width="220" height="70" rx="10" fill="#f1f3f5" stroke="#1e1e1e" stroke-width="2"/>
  <text id="worldimpl-name" x="130" y="318" font-size="18" font-weight="700" text-anchor="middle" fill="#1e1e1e">WorldImpl</text>
  <text id="worldimpl-sub" x="130" y="342" font-size="14" text-anchor="middle" fill="#343a40">resolves ids (class)</text>

  <rect id="flow-box" x="20" y="455" width="220" height="70" rx="10" fill="#dbe4ff" stroke="#1e1e1e" stroke-width="2"/>
  <text id="flow-name" x="130" y="483" font-size="18" font-weight="700" text-anchor="middle" fill="#1e1e1e">Flow</text>
  <text id="flow-sub" x="130" y="507" font-size="14" text-anchor="middle" fill="#343a40">abstract base (ABC)</text>

  <!-- column B: callers and flow classes -->
  <rect id="worldsim-box" x="340" y="30" width="220" height="70" rx="10" fill="#f1f3f5" stroke="#1e1e1e" stroke-width="2"/>
  <text id="worldsim-name" x="450" y="58" font-size="18" font-weight="700" text-anchor="middle" fill="#1e1e1e">WorldSimulatorImpl</text>
  <text id="worldsim-sub" x="450" y="82" font-size="14" text-anchor="middle" fill="#343a40">step (class)</text>

  <rect id="jax-box" x="340" y="130" width="220" height="70" rx="10" fill="#f1f3f5" stroke="#1e1e1e" stroke-width="2"/>
  <text id="jax-name" x="450" y="158" font-size="18" font-weight="700" text-anchor="middle" fill="#1e1e1e">JaxWorldSimulator</text>
  <text id="jax-sub" x="450" y="182" font-size="14" text-anchor="middle" fill="#343a40">step, host side (class)</text>

  <rect id="transportflux-box" x="340" y="230" width="220" height="70" rx="10" fill="#dbe4ff" stroke="#1e1e1e" stroke-width="2"/>
  <text id="transportflux-name" x="450" y="258" font-size="18" font-weight="700" text-anchor="middle" fill="#1e1e1e">TransportFlux</text>
  <text id="transportflux-sub" x="450" y="282" font-size="14" text-anchor="middle" fill="#343a40">class</text>

  <rect id="generalflow-box" x="340" y="455" width="220" height="70" rx="10" fill="#dbe4ff" stroke="#1e1e1e" stroke-width="2"/>
  <text id="generalflow-name" x="450" y="483" font-size="18" font-weight="700" text-anchor="middle" fill="#1e1e1e">GeneralFlow</text>
  <text id="generalflow-sub" x="450" y="507" font-size="14" text-anchor="middle" fill="#343a40">class, the escape</text>

  <!-- inside apply_flows -->
  <rect id="frozen-box" x="640" y="70" width="210" height="70" rx="10" fill="#fff9db" stroke="#1e1e1e" stroke-width="2"/>
  <text id="frozen-name" x="745" y="98" font-size="18" font-weight="700" text-anchor="middle" fill="#1e1e1e">frozen</text>
  <text id="frozen-sub" x="745" y="122" font-size="14" text-anchor="middle" fill="#343a40">WorldStateImpl (read)</text>

  <rect id="demand-box" x="640" y="230" width="210" height="70" rx="10" fill="#dbe4ff" stroke="#1e1e1e" stroke-width="2"/>
  <text id="demand-name" x="745" y="258" font-size="18" font-weight="700" text-anchor="middle" fill="#1e1e1e">demand</text>
  <text id="demand-sub" x="745" y="282" font-size="14" text-anchor="middle" fill="#343a40">events, draws per flux</text>

  <rect id="summed-box" x="640" y="360" width="210" height="70" rx="10" fill="#dbe4ff" stroke="#1e1e1e" stroke-width="2"/>
  <text id="summed-name" x="745" y="388" font-size="18" font-weight="700" text-anchor="middle" fill="#1e1e1e">summed draw</text>
  <text id="summed-sub" x="745" y="412" font-size="14" text-anchor="middle" fill="#343a40">per (comp, mol) pool</text>

  <rect id="ration-box" x="940" y="360" width="210" height="70" rx="10" fill="#dbe4ff" stroke="#1e1e1e" stroke-width="2"/>
  <text id="ration-name" x="1045" y="388" font-size="18" font-weight="700" text-anchor="middle" fill="#1e1e1e">ration</text>
  <text id="ration-sub" x="1045" y="412" font-size="14" text-anchor="middle" fill="#343a40">min(1, avail / demand)</text>

  <rect id="apply-events-box" x="940" y="230" width="210" height="70" rx="10" fill="#dbe4ff" stroke="#1e1e1e" stroke-width="2"/>
  <text id="apply-events-name" x="1045" y="258" font-size="18" font-weight="700" text-anchor="middle" fill="#1e1e1e">apply_events</text>
  <text id="apply-events-sub" x="1045" y="282" font-size="14" text-anchor="middle" fill="#343a40">events × tightest ratio</text>

  <rect id="new-state-box" x="940" y="70" width="210" height="70" rx="10" fill="#fff9db" stroke="#1e1e1e" stroke-width="2"/>
  <text id="new-state-name" x="1045" y="98" font-size="18" font-weight="700" text-anchor="middle" fill="#1e1e1e">new_state</text>
  <text id="new-state-sub" x="1045" y="122" font-size="14" text-anchor="middle" fill="#343a40">WorldStateImpl (written)</text>

  <rect id="general-apply-box" x="640" y="455" width="510" height="70" rx="10" fill="#dbe4ff" stroke="#1e1e1e" stroke-width="2"/>
  <text id="general-apply-name" x="895" y="483" font-size="18" font-weight="700" text-anchor="middle" fill="#1e1e1e">GeneralFlow.apply</text>
  <text id="general-apply-sub" x="895" y="507" font-size="14" text-anchor="middle" fill="#343a40">edits new_state after the fluxes, one at a time, in list order</text>

  <!-- edges: authoring thread -->
  <line id="e-realize" x1="130" y1="120" x2="130" y2="170" stroke="#1e1e1e" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text id="l-realize" x="140" y="150" font-size="14" font-style="italic" fill="#1864ab">realize</text>
  <line id="e-materialize" x1="130" y1="240" x2="130" y2="290" stroke="#1e1e1e" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text id="l-materialize" x="140" y="270" font-size="14" font-style="italic" fill="#1864ab">materialize</text>
  <line id="e-builds" x1="240" y1="315" x2="340" y2="275" stroke="#1e1e1e" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text id="l-builds" x="300" y="318" font-size="14" font-style="italic" fill="#1864ab" text-anchor="middle">builds</text>
  <line id="e-flowobjs" x1="240" y1="295" x2="340" y2="95" stroke="#1e1e1e" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrowhead)"/>
  <text id="l-flowobjs" x="277" y="196" font-size="14" font-style="italic" fill="#1864ab" text-anchor="middle" transform="rotate(-63.4 277 196)">flow_objs</text>

  <!-- edges: derives -->
  <line id="e-tf-derives" x1="370" y1="300" x2="210" y2="455" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowhead)"/>
  <line id="e-gf-derives" x1="340" y1="490" x2="240" y2="490" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowhead)"/>
  <text id="l-derives" x="290" y="482" font-size="14" font-style="italic" fill="#1864ab" text-anchor="middle">derives</text>

  <!-- edges: callers into apply_flows -->
  <line id="e-ws-calls" x1="560" y1="65" x2="610" y2="65" stroke="#1e1e1e" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text id="l-ws-calls" x="584" y="57" font-size="14" font-style="italic" fill="#1864ab" text-anchor="middle">calls</text>
  <line id="e-jax-calls" x1="560" y1="165" x2="610" y2="165" stroke="#1e1e1e" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text id="l-jax-calls" x="584" y="157" font-size="14" font-style="italic" fill="#1864ab" text-anchor="middle">calls</text>
  <line id="e-fluxes" x1="560" y1="265" x2="640" y2="265" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowhead)"/>
  <text id="l-fluxes" x="586" y="257" font-size="14" font-style="italic" fill="#1864ab" text-anchor="middle">fluxes</text>
  <line id="e-others" x1="560" y1="490" x2="640" y2="490" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowhead)"/>
  <text id="l-others" x="586" y="482" font-size="14" font-style="italic" fill="#1864ab" text-anchor="middle">others</text>

  <!-- edges: the pass -->
  <line id="e-read" x1="745" y1="140" x2="745" y2="230" stroke="#1e1e1e" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text id="l-read" x="755" y="190" font-size="14" font-style="italic" fill="#1864ab">rate law reads</text>
  <line id="e-sum" x1="745" y1="300" x2="745" y2="360" stroke="#1e1e1e" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text id="l-sum" x="755" y="335" font-size="14" font-style="italic" fill="#1864ab">sum</text>
  <line id="e-demand" x1="850" y1="395" x2="940" y2="395" stroke="#1e1e1e" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text id="l-demand" x="895" y="387" font-size="14" font-style="italic" fill="#1864ab" text-anchor="middle">demand</text>
  <line id="e-scale" x1="1045" y1="360" x2="1045" y2="300" stroke="#1e1e1e" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text id="l-scale" x="1055" y="335" font-size="14" font-style="italic" fill="#1864ab">scale</text>
  <line id="e-write" x1="1045" y1="230" x2="1045" y2="140" stroke="#1e1e1e" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text id="l-write" x="1055" y="190" font-size="14" font-style="italic" fill="#1864ab">write at once</text>
  <line id="e-available" x1="850" y1="130" x2="960" y2="360" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowhead)"/>
  <text id="l-available" x="908" y="210" font-size="14" font-style="italic" fill="#1864ab" text-anchor="middle" transform="rotate(64.4 908 210)">available</text>

  <!-- legend -->
  <rect id="legend-box" x="20" y="575" width="1160" height="85" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="1.5"/>
  <line id="legend-solid" x1="40" y1="605" x2="100" y2="605" stroke="#1e1e1e" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text id="legend-solid-text" x="112" y="610" font-size="14" fill="#1e1e1e">call or data flow</text>
  <line id="legend-dotted" x1="40" y1="637" x2="100" y2="637" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowhead)"/>
  <text id="legend-dotted-text" x="112" y="642" font-size="14" fill="#1e1e1e">carries, reads, derives from</text>
  <rect id="legend-blue" x="400" y="593" width="26" height="18" rx="3" fill="#dbe4ff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text id="legend-blue-text" x="436" y="608" font-size="14" fill="#1e1e1e">defined in bio/flow.py</text>
  <rect id="legend-yellow" x="400" y="625" width="26" height="18" rx="3" fill="#fff9db" stroke="#1e1e1e" stroke-width="1.5"/>
  <text id="legend-yellow-text" x="436" y="640" font-size="14" fill="#1e1e1e">WorldStateImpl, the two states the pass touches</text>
  <rect id="legend-grey" x="800" y="593" width="26" height="18" rx="3" fill="#f1f3f5" stroke="#1e1e1e" stroke-width="1.5"/>
  <text id="legend-grey-text" x="836" y="608" font-size="14" fill="#1e1e1e">another module (author or caller)</text>
  <rect id="legend-frame" x="800" y="625" width="26" height="18" rx="3" fill="#f4f6ff" stroke="#3b5bdb" stroke-width="1.5"/>
  <text id="legend-frame-text" x="836" y="640" font-size="14" fill="#1e1e1e">inside apply_flows</text>
</svg>
