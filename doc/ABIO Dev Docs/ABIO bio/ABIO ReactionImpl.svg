<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1360" viewBox="0 0 1200 680" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="#1e1e1e"/>
    </marker>
  </defs>
  <rect id="background" x="0" y="0" width="1200" height="680" fill="#ffffff"/>

  <!-- Base class -->
  <rect id="entity-box" x="500" y="6" width="200" height="50" rx="10" fill="#f1f3f5" stroke="#1e1e1e" stroke-width="2"/>
  <text id="entity-name" x="600" y="28" font-size="18" font-weight="600" text-anchor="middle">Entity</text>
  <text id="entity-kind" x="600" y="47" font-size="14" text-anchor="middle">(base, infra/entity)</text>

  <!-- Hub -->
  <rect id="rxn-box" x="410" y="110" width="380" height="320" rx="12" fill="#bac8ff" stroke="#1e1e1e" stroke-width="2"/>
  <text id="rxn-name" x="600" y="138" font-size="22" font-weight="700" text-anchor="middle">ReactionImpl</text>
  <text id="rxn-kind" x="600" y="160" font-size="14" text-anchor="middle">(class, head "Reaction")</text>
  <text id="rxn-f1" x="430" y="192" font-size="16">reactants: {MoleculeImpl: coef}</text>
  <text id="rxn-f2" x="430" y="216" font-size="16">products: {MoleculeImpl: coef}</text>
  <text id="rxn-f3" x="430" y="240" font-size="16">modifiers: {MoleculeImpl: Modulation | str}</text>
  <text id="rxn-f4" x="430" y="264" font-size="16">rate: float</text>
  <text id="rxn-f5" x="430" y="288" font-size="16">rate_law: rate_expr tree | None</text>
  <text id="rxn-f6" x="430" y="312" font-size="16">symbol · attributes() · hydrate()</text>
  <rect id="law-box" x="430" y="326" width="340" height="94" rx="8" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text id="law-1" x="600" y="348" font-size="16" font-weight="600" text-anchor="middle">one rate grammar</text>
  <text id="law-2" x="600" y="370" font-size="14" text-anchor="middle">rate_law set: the numeric rate is unused;</text>
  <text id="law-3" x="600" y="389" font-size="14" text-anchor="middle">Modulation modifiers still multiply in;</text>
  <text id="law-4" x="600" y="408" font-size="14" text-anchor="middle">a non-number rate is refused downstream</text>

  <!-- derives from -->
  <line id="e-derives" x1="600" y1="110" x2="600" y2="56" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowhead)"/>
  <text id="l-derives" x="612" y="88" font-size="14" fill="#1971c2" font-style="italic">derives from</text>

  <!-- Construction paths (left) -->
  <rect id="compile-box" x="20" y="30" width="250" height="64" rx="10" fill="#fff3f3" stroke="#1e1e1e" stroke-width="2"/>
  <text id="compile-name" x="145" y="57" font-size="18" font-weight="600" text-anchor="middle">compile_rate</text>
  <text id="compile-kind" x="145" y="79" font-size="14" text-anchor="middle">(function, suite/rate_law)</text>
  <line id="e-compile" x1="145" y1="94" x2="145" y2="206" stroke="#1e1e1e" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text id="l-compile" x="157" y="156" font-size="14" fill="#1971c2" font-style="italic">RateLaw</text>

  <rect id="block-box" x="20" y="206" width="250" height="64" rx="10" fill="#fff3f3" stroke="#1e1e1e" stroke-width="2"/>
  <text id="block-name" x="145" y="233" font-size="18" font-weight="600" text-anchor="middle">RateLawBlock</text>
  <text id="block-kind" x="145" y="255" font-size="14" text-anchor="middle">(block, suite/expr_heads)</text>
  <line id="e-block" x1="270" y1="238" x2="410" y2="238" stroke="#1e1e1e" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text id="l-block" x="340" y="210" font-size="14" fill="#1971c2" font-style="italic" text-anchor="middle">realize:</text>
  <text id="l-block-2" x="340" y="228" font-size="14" fill="#1971c2" font-style="italic" text-anchor="middle">Modulations, tree</text>

  <rect id="expr-box" x="20" y="296" width="250" height="64" rx="10" fill="#fff3f3" stroke="#1e1e1e" stroke-width="2"/>
  <text id="expr-name" x="145" y="323" font-size="18" font-weight="600" text-anchor="middle">!Reaction</text>
  <text id="expr-kind" x="145" y="345" font-size="14" text-anchor="middle">(Expr constructor head)</text>
  <line id="e-expr" x1="270" y1="328" x2="410" y2="328" stroke="#1e1e1e" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text id="l-expr" x="340" y="318" font-size="14" fill="#1971c2" font-style="italic" text-anchor="middle">hydrate</text>

  <rect id="mk-box" x="20" y="386" width="250" height="64" rx="10" fill="#fff3f3" stroke="#1e1e1e" stroke-width="2"/>
  <text id="mk-name" x="145" y="413" font-size="18" font-weight="600" text-anchor="middle">mk.R</text>
  <text id="mk-kind" x="145" y="435" font-size="14" text-anchor="middle">(maker, bio/makers)</text>
  <line id="e-mk" x1="270" y1="410" x2="410" y2="410" stroke="#1e1e1e" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text id="l-mk" x="340" y="400" font-size="14" fill="#1971c2" font-style="italic" text-anchor="middle">construct</text>

  <!-- Readers (right) -->
  <rect id="chem-box" x="930" y="110" width="250" height="64" rx="10" fill="#ebfbee" stroke="#1e1e1e" stroke-width="2"/>
  <text id="chem-name" x="1055" y="137" font-size="18" font-weight="600" text-anchor="middle">ChemistryImpl</text>
  <text id="chem-kind" x="1055" y="159" font-size="14" text-anchor="middle">(class, bio/chemistry)</text>
  <line id="e-chem" x1="790" y1="142" x2="930" y2="142" stroke="#1e1e1e" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text id="l-chem" x="860" y="132" font-size="14" fill="#1971c2" font-style="italic" text-anchor="middle">held by id</text>

  <rect id="spec-box" x="930" y="200" width="250" height="64" rx="10" fill="#ebfbee" stroke="#1e1e1e" stroke-width="2"/>
  <text id="spec-name" x="1055" y="227" font-size="18" font-weight="600" text-anchor="middle">ReactionSpec</text>
  <text id="spec-kind" x="1055" y="249" font-size="14" text-anchor="middle">(class, world_simulator)</text>
  <line id="e-spec" x1="790" y1="232" x2="930" y2="232" stroke="#1e1e1e" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text id="l-spec" x="860" y="222" font-size="14" fill="#1971c2" font-style="italic" text-anchor="middle">from_chemistry</text>

  <rect id="cons-box" x="930" y="290" width="250" height="64" rx="10" fill="#ebfbee" stroke="#1e1e1e" stroke-width="2"/>
  <text id="cons-name" x="1055" y="317" font-size="18" font-weight="600" text-anchor="middle">reaction_imbalance</text>
  <text id="cons-kind" x="1055" y="339" font-size="14" text-anchor="middle">(function, bio/conservation)</text>
  <line id="e-cons" x1="790" y1="322" x2="930" y2="322" stroke="#1e1e1e" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text id="l-cons" x="860" y="312" font-size="14" fill="#1971c2" font-style="italic" text-anchor="middle">atom balance</text>

  <rect id="energy-box" x="930" y="380" width="250" height="64" rx="10" fill="#ebfbee" stroke="#1e1e1e" stroke-width="2"/>
  <text id="energy-name" x="1055" y="407" font-size="18" font-weight="600" text-anchor="middle">reaction_delta_g</text>
  <text id="energy-kind" x="1055" y="429" font-size="14" text-anchor="middle">(function, bio/energy)</text>
  <line id="e-energy" x1="790" y1="410" x2="930" y2="410" stroke="#1e1e1e" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text id="l-energy" x="860" y="400" font-size="14" fill="#1971c2" font-style="italic" text-anchor="middle">ΔG</text>

  <!-- Held structures (bottom row) -->
  <rect id="mol-box" x="300" y="500" width="190" height="56" rx="10" fill="#fff9db" stroke="#1e1e1e" stroke-width="2"/>
  <text id="mol-name" x="395" y="524" font-size="18" font-weight="600" text-anchor="middle">MoleculeImpl</text>
  <text id="mol-kind" x="395" y="544" font-size="14" text-anchor="middle">(class, dict keys)</text>

  <rect id="mod-box" x="520" y="500" width="160" height="56" rx="10" fill="#fff9db" stroke="#1e1e1e" stroke-width="2"/>
  <text id="mod-name" x="600" y="524" font-size="18" font-weight="600" text-anchor="middle">Modulation</text>
  <text id="mod-kind" x="600" y="544" font-size="14" text-anchor="middle">(frozen dataclass)</text>

  <rect id="tree-box" x="710" y="500" width="190" height="56" rx="10" fill="#fff9db" stroke="#1e1e1e" stroke-width="2"/>
  <text id="tree-name" x="805" y="524" font-size="18" font-weight="600" text-anchor="middle">rate_expr tree</text>
  <text id="tree-kind" x="805" y="544" font-size="14" text-anchor="middle">(nested tuple)</text>

  <!-- contains -->
  <line id="e-has-mol" x1="470" y1="430" x2="420" y2="500" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowhead)"/>
  <text id="l-has-mol" x="428" y="470" font-size="14" fill="#1971c2" font-style="italic" text-anchor="end">stoichiometry</text>
  <line id="e-has-mod" x1="600" y1="430" x2="600" y2="500" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowhead)"/>
  <text id="l-has-mod" x="610" y="470" font-size="14" fill="#1971c2" font-style="italic">modifier values</text>
  <line id="e-has-tree" x1="740" y1="430" x2="790" y2="500" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowhead)"/>
  <text id="l-has-tree" x="778" y="460" font-size="14" fill="#1971c2" font-style="italic">rate_law</text>

  <!-- Legend -->
  <line id="legend-solid" x1="20" y1="652" x2="110" y2="652" stroke="#1e1e1e" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text id="legend-solid-label" x="120" y="657" font-size="14">builds or reads</text>
  <line id="legend-dotted" x1="260" y1="652" x2="330" y2="652" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowhead)"/>
  <text id="legend-dotted-label" x="340" y="657" font-size="14">contains, derives from</text>
  <rect id="legend-in" x="600" y="642" width="18" height="18" fill="#fff3f3" stroke="#1e1e1e"/>
  <text id="legend-in-label" x="626" y="657" font-size="14">construction path</text>
  <rect id="legend-out" x="770" y="642" width="18" height="18" fill="#ebfbee" stroke="#1e1e1e"/>
  <text id="legend-out-label" x="796" y="657" font-size="14">reader</text>
  <rect id="legend-held" x="870" y="642" width="18" height="18" fill="#fff9db" stroke="#1e1e1e"/>
  <text id="legend-held-label" x="896" y="657" font-size="14">held structure</text>
</svg>
