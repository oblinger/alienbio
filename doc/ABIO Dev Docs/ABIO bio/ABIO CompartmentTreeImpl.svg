<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1360" viewBox="0 0 1200 680" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <polygon id="arrowhead-shape" points="0,0 10,5 0,10" fill="#1e1e1e"/>
    </marker>
  </defs>
  <rect id="bg" x="0" y="0" width="1200" height="680" fill="#ffffff"/>
  <g id="n-comp">
    <rect id="n-comp-box" x="20" y="40" width="240" height="70" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-comp-name" x="140.0" y="68" font-size="18" font-weight="600" text-anchor="middle">Compartment specs</text>
    <text id="n-comp-kind" x="140.0" y="92" font-size="14" text-anchor="middle">(data) world.py flat list</text>
  </g>
  <g id="n-bt">
    <rect id="n-bt-box" x="320" y="40" width="240" height="70" rx="10" fill="#f3f0ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-bt-name" x="440.0" y="68" font-size="18" font-weight="600" text-anchor="middle">build_tree</text>
    <text id="n-bt-kind" x="440.0" y="92" font-size="14" text-anchor="middle">(fn) one root · unique · acyclic</text>
  </g>
  <g id="n-add">
    <rect id="n-add-box" x="620" y="40" width="240" height="70" rx="10" fill="#bac8ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-add-name" x="740.0" y="68" font-size="18" font-weight="600" text-anchor="middle">add_root / add_child</text>
    <text id="n-add-kind" x="740.0" y="92" font-size="14" text-anchor="middle">(methods) append the next id</text>
  </g>
  <g id="n-proto">
    <rect id="n-proto-box" x="920" y="40" width="240" height="70" rx="10" fill="#f3f0ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-proto-name" x="1040.0" y="68" font-size="18" font-weight="600" text-anchor="middle">CompartmentTree</text>
    <text id="n-proto-kind" x="1040.0" y="92" font-size="14" text-anchor="middle">(Protocol) protocols/bio.py</text>
  </g>
  <g id="n-ws">
    <rect id="n-ws-box" x="20" y="220" width="240" height="70" rx="10" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-ws-name" x="140.0" y="248" font-size="18" font-weight="600" text-anchor="middle">WorldStateImpl</text>
    <text id="n-ws-kind" x="140.0" y="272" font-size="14" text-anchor="middle">(class) arrays sized C × M</text>
  </g>
  <g id="n-tree">
    <rect id="n-tree-box" x="620" y="210" width="240" height="90" rx="10" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-tree-name" x="740.0" y="238" font-size="18" font-weight="600" text-anchor="middle">CompartmentTreeImpl</text>
    <text id="n-tree-kind" x="740.0" y="262" font-size="14" text-anchor="middle">(class) _parents · _children</text>
    <text id="n-tree-kind2" x="740.0" y="280" font-size="14" text-anchor="middle">_names · _root</text>
  </g>
  <g id="n-dict">
    <rect id="n-dict-box" x="920" y="220" width="240" height="70" rx="10" fill="#bac8ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-dict-name" x="1040.0" y="248" font-size="18" font-weight="600" text-anchor="middle">to_dict / from_dict</text>
    <text id="n-dict-kind" x="1040.0" y="272" font-size="14" text-anchor="middle">(methods) lists, no checks</text>
  </g>
  <g id="n-ref">
    <rect id="n-ref-box" x="20" y="400" width="240" height="70" rx="10" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-ref-name" x="140.0" y="428" font-size="18" font-weight="600" text-anchor="middle">WorldSimulatorImpl</text>
    <text id="n-ref-kind" x="140.0" y="452" font-size="14" text-anchor="middle">(class) per-compartment loop</text>
  </g>
  <g id="n-jax">
    <rect id="n-jax-box" x="320" y="400" width="240" height="70" rx="10" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-jax-name" x="440.0" y="428" font-size="18" font-weight="600" text-anchor="middle">JaxWorldSimulator</text>
    <text id="n-jax-kind" x="440.0" y="452" font-size="14" text-anchor="middle">(class) [C, M] array</text>
  </g>
  <g id="n-read">
    <rect id="n-read-box" x="620" y="400" width="240" height="90" rx="10" fill="#bac8ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-read-name" x="740.0" y="428" font-size="18" font-weight="600" text-anchor="middle">readers</text>
    <text id="n-read-kind" x="740.0" y="452" font-size="14" text-anchor="middle">(methods) parent · children · root</text>
    <text id="n-read-kind2" x="740.0" y="470" font-size="14" text-anchor="middle">ancestors · descendants · depth</text>
  </g>
  <g id="n-str">
    <rect id="n-str-box" x="920" y="400" width="240" height="70" rx="10" fill="#bac8ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-str-name" x="1040.0" y="428" font-size="18" font-weight="600" text-anchor="middle">__str__ ‡</text>
    <text id="n-str-kind" x="1040.0" y="452" font-size="14" text-anchor="middle">(method) indented text</text>
  </g>
  <line id="e-comp-bt" x1="260" y1="75" x2="320" y2="75" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line id="e-bt-add" x1="560" y1="75" x2="620" y2="75" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line id="e-add-tree" x1="740" y1="110" x2="740" y2="210" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text id="l-add-tree" x="750" y="165" font-size="14" fill="#1971c2" font-style="italic" text-anchor="start">grows</text>
  <line id="e-tree-proto" x1="860" y1="215" x2="1000" y2="110" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <text id="l-tree-proto" x="950" y="175" font-size="14" fill="#1971c2" font-style="italic" text-anchor="start">conforms</text>
  <line id="e-tree-dict" x1="860" y1="255" x2="920" y2="255" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <line id="e-tree-ws" x1="620" y1="255" x2="260" y2="255" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <text id="l-tree-ws" x="440" y="245" font-size="14" fill="#1971c2" font-style="italic" text-anchor="middle">num_compartments</text>
  <line id="e-ws-ref" x1="140" y1="290" x2="140" y2="400" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <text id="l-ws-ref" x="150" y="350" font-size="14" fill="#1971c2" font-style="italic" text-anchor="start">carries tree</text>
  <line id="e-tree-jax" x1="660" y1="300" x2="500" y2="400" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <text id="l-tree-jax" x="560" y="335" font-size="14" fill="#1971c2" font-style="italic" text-anchor="end">num_compartments</text>
  <line id="e-tree-read" x1="740" y1="300" x2="740" y2="400" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line id="e-tree-str" x1="840" y1="300" x2="980" y2="400" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <text id="t-note1" x="20" y="530" font-size="14" fill="#495057" text-anchor="start">No step, flow or population pass calls parent or children: the simulators and the state read num_compartments only,</text>
  <text id="t-note2" x="20" y="550" font-size="14" fill="#495057" text-anchor="start">so which compartment is whose parent changes nothing a step does. ‡ grandchildren print without a connector.</text>
  <text id="t-legend" x="20" y="655" font-size="13" fill="#495057" text-anchor="start">solid: build · dotted: reads, carries, conforms · lilac: outside caller or contract</text>
</svg>
