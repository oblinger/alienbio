<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1360" viewBox="0 0 1200 680" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="#1e1e1e"/>
    </marker>
  </defs>
  <rect id="background" x="0" y="0" width="1200" height="680" fill="#ffffff"/>

  <!-- Row A: declared specs (bio/world.py) -->
  <g id="spec-growth">
    <rect x="40" y="24" width="240" height="64" rx="10" fill="#fff9db" stroke="#1e1e1e" stroke-width="2"/>
    <text x="160" y="52" font-size="18" font-weight="600" text-anchor="middle">GrowthLaw</text>
    <text x="160" y="74" font-size="14" text-anchor="middle" fill="#333333">(spec, world.py)</text>
  </g>
  <g id="spec-death">
    <rect x="340" y="24" width="240" height="64" rx="10" fill="#fff9db" stroke="#1e1e1e" stroke-width="2"/>
    <text x="460" y="52" font-size="18" font-weight="600" text-anchor="middle">DeathLaw</text>
    <text x="460" y="74" font-size="14" text-anchor="middle" fill="#333333">(spec, world.py)</text>
  </g>
  <g id="spec-countflow">
    <rect x="640" y="24" width="240" height="64" rx="10" fill="#fff9db" stroke="#1e1e1e" stroke-width="2"/>
    <text x="760" y="52" font-size="18" font-weight="600" text-anchor="middle">CountFlowSpec</text>
    <text x="760" y="74" font-size="14" text-anchor="middle" fill="#333333">(spec, world.py)</text>
  </g>

  <!-- spec -> law resolution -->
  <line id="e-resolve-growth" x1="160" y1="88" x2="160" y2="140" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line id="e-resolve-death" x1="460" y1="88" x2="460" y2="140" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line id="e-resolve-countflow" x1="760" y1="88" x2="760" y2="140" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text id="l-resolve" x="776" y="120" font-size="14" font-style="italic" fill="#1864ab">WorldImpl resolves string ids to ints</text>

  <!-- Row B: the three laws -->
  <g id="law-growth">
    <rect x="40" y="140" width="240" height="64" rx="10" fill="#dbe4ff" stroke="#1e1e1e" stroke-width="2"/>
    <text x="160" y="168" font-size="18" font-weight="600" text-anchor="middle">PerCapitaGrowth</text>
    <text x="160" y="190" font-size="14" text-anchor="middle" fill="#333333">(class) k·N·[resource]</text>
  </g>
  <g id="law-death">
    <rect x="340" y="140" width="240" height="64" rx="10" fill="#dbe4ff" stroke="#1e1e1e" stroke-width="2"/>
    <text x="460" y="168" font-size="18" font-weight="600" text-anchor="middle">PerCapitaDeath</text>
    <text x="460" y="190" font-size="14" text-anchor="middle" fill="#333333">(class) k·N</text>
  </g>
  <g id="law-countflow">
    <rect x="640" y="140" width="240" height="64" rx="10" fill="#dbe4ff" stroke="#1e1e1e" stroke-width="2"/>
    <text x="760" y="168" font-size="18" font-weight="600" text-anchor="middle">CountFlow</text>
    <text x="760" y="190" font-size="14" text-anchor="middle" fill="#333333">(class) k·N_origin</text>
  </g>

  <!-- derives-from (dotted) -->
  <line id="e-derive-growth" x1="220" y1="204" x2="372" y2="264" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrowhead)"/>
  <line id="e-derive-death" x1="460" y1="204" x2="460" y2="264" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrowhead)"/>
  <line id="e-derive-countflow" x1="700" y1="204" x2="548" y2="264" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrowhead)"/>
  <text id="l-derive" x="470" y="240" font-size="14" font-style="italic" fill="#1864ab">derives</text>

  <!-- Row C: resource pool, base, frozen state -->
  <g id="resource-pool">
    <rect x="40" y="264" width="240" height="64" rx="10" fill="#fff9db" stroke="#1e1e1e" stroke-width="2"/>
    <text x="160" y="292" font-size="18" font-weight="600" text-anchor="middle">resource pool</text>
    <text x="160" y="314" font-size="14" text-anchor="middle" fill="#333333">(compartment, molecule)</text>
  </g>
  <line id="e-draw" x1="100" y1="204" x2="100" y2="264" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text id="l-draw" x="110" y="238" font-size="14" font-style="italic" fill="#1864ab">draws stoich·ΔN</text>

  <g id="base">
    <rect x="340" y="264" width="240" height="64" rx="10" fill="#ebfbee" stroke="#1e1e1e" stroke-width="2"/>
    <text x="460" y="292" font-size="18" font-weight="600" text-anchor="middle">PopulationLaw</text>
    <text x="460" y="314" font-size="14" text-anchor="middle" fill="#333333">(abstract class)</text>
  </g>

  <g id="frozen">
    <rect x="700" y="264" width="240" height="64" rx="10" fill="#fff9db" stroke="#1e1e1e" stroke-width="2"/>
    <text x="820" y="292" font-size="18" font-weight="600" text-anchor="middle">frozen</text>
    <text x="820" y="314" font-size="14" text-anchor="middle" fill="#333333">(WorldStateImpl, read only)</text>
  </g>
  <line id="e-read" x1="700" y1="296" x2="580" y2="296" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrowhead)"/>
  <text id="l-read" x="640" y="286" font-size="14" font-style="italic" fill="#1864ab" text-anchor="middle">reads</text>

  <!-- Row D: the pass -->
  <g id="apply">
    <rect x="340" y="384" width="240" height="66" rx="10" fill="#bac8ff" stroke="#1e1e1e" stroke-width="2"/>
    <text x="460" y="412" font-size="18" font-weight="600" text-anchor="middle">apply_population_laws</text>
    <text x="460" y="434" font-size="14" text-anchor="middle" fill="#1e1e1e">(function) the pass</text>
  </g>
  <line id="e-contribute" x1="420" y1="384" x2="420" y2="328" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text id="l-contribute" x="410" y="362" font-size="14" font-style="italic" fill="#1864ab" text-anchor="end">contribute</text>
  <line id="e-deltas" x1="500" y1="328" x2="500" y2="384" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrowhead)"/>
  <text id="l-deltas" x="510" y="362" font-size="14" font-style="italic" fill="#1864ab">per-law deltas</text>

  <g id="ration">
    <rect x="700" y="384" width="240" height="66" rx="10" fill="#bac8ff" stroke="#1e1e1e" stroke-width="2"/>
    <text x="820" y="412" font-size="18" font-weight="600" text-anchor="middle">summed-demand ration</text>
    <text x="820" y="434" font-size="14" text-anchor="middle" fill="#1e1e1e">min-ratio per drained key</text>
  </g>
  <line id="e-sum" x1="580" y1="417" x2="700" y2="417" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text id="l-sum" x="640" y="407" font-size="14" font-style="italic" fill="#1864ab" text-anchor="middle">sum</text>
  <line id="e-available" x1="820" y1="328" x2="820" y2="384" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrowhead)"/>
  <text id="l-available" x="830" y="362" font-size="14" font-style="italic" fill="#1864ab">available</text>

  <g id="new-state">
    <rect x="990" y="384" width="190" height="66" rx="10" fill="#fff9db" stroke="#1e1e1e" stroke-width="2"/>
    <text x="1085" y="412" font-size="18" font-weight="600" text-anchor="middle">new_state</text>
    <text x="1085" y="434" font-size="14" text-anchor="middle" fill="#333333">(WorldStateImpl)</text>
  </g>
  <line id="e-write" x1="940" y1="417" x2="990" y2="417" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text id="l-write" x="1085" y="472" font-size="14" font-style="italic" fill="#1864ab" text-anchor="middle">N and conc, snapped</text>

  <!-- Row E: callers -->
  <g id="sim-reference">
    <rect x="40" y="530" width="260" height="66" rx="10" fill="#fff3f3" stroke="#1e1e1e" stroke-width="2"/>
    <text x="170" y="558" font-size="18" font-weight="600" text-anchor="middle">WorldSimulatorImpl</text>
    <text x="170" y="580" font-size="14" text-anchor="middle" fill="#333333">(class) step, pass 3</text>
  </g>
  <line id="e-call-reference" x1="220" y1="530" x2="370" y2="450" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text id="l-call-reference" x="290" y="480" font-size="14" font-style="italic" fill="#1864ab" text-anchor="end">after flows</text>

  <g id="sim-jax">
    <rect x="340" y="530" width="260" height="66" rx="10" fill="#fff3f3" stroke="#1e1e1e" stroke-width="2"/>
    <text x="470" y="558" font-size="18" font-weight="600" text-anchor="middle">JaxWorldSimulator</text>
    <text x="470" y="580" font-size="14" text-anchor="middle" fill="#333333">(class) step, on host</text>
  </g>
  <line id="e-call-jax" x1="470" y1="530" x2="470" y2="450" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>

  <g id="sim-fast">
    <rect x="700" y="530" width="240" height="66" rx="10" fill="#fff3f3" stroke="#1e1e1e" stroke-width="2"/>
    <text x="820" y="558" font-size="18" font-weight="600" text-anchor="middle">run_fast · run_batch</text>
    <text x="820" y="580" font-size="14" text-anchor="middle" fill="#333333">(JAX methods)</text>
  </g>
  <line id="e-refuse" x1="740" y1="530" x2="600" y2="470" stroke="#c92a2a" stroke-width="2" stroke-dasharray="6,5"/>
  <line id="x-refuse-a" x1="590" y1="458" x2="610" y2="478" stroke="#c92a2a" stroke-width="3"/>
  <line id="x-refuse-b" x1="610" y1="458" x2="590" y2="478" stroke="#c92a2a" stroke-width="3"/>
  <text id="l-refuse" x="690" y="490" font-size="14" font-style="italic" fill="#c92a2a">refuse: ValueError</text>

  <!-- Legend -->
  <g id="legend">
    <line x1="40" y1="648" x2="90" y2="648" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="100" y="653" font-size="14">call / primary flow</text>
    <line x1="250" y1="648" x2="300" y2="648" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrowhead)"/>
    <text x="310" y="653" font-size="14">reads, returns, derives</text>
    <rect x="540" y="638" width="22" height="20" rx="4" fill="#fff9db" stroke="#1e1e1e" stroke-width="1.5"/>
    <text x="570" y="653" font-size="14">data</text>
    <rect x="620" y="638" width="22" height="20" rx="4" fill="#dbe4ff" stroke="#1e1e1e" stroke-width="1.5"/>
    <text x="650" y="653" font-size="14">law</text>
    <rect x="695" y="638" width="22" height="20" rx="4" fill="#bac8ff" stroke="#1e1e1e" stroke-width="1.5"/>
    <text x="725" y="653" font-size="14">pass</text>
    <rect x="775" y="638" width="22" height="20" rx="4" fill="#fff3f3" stroke="#1e1e1e" stroke-width="1.5"/>
    <text x="805" y="653" font-size="14">caller</text>
    <line x1="880" y1="648" x2="930" y2="648" stroke="#c92a2a" stroke-width="2" stroke-dasharray="6,5"/>
    <text x="940" y="653" font-size="14">refused path</text>
  </g>
</svg>
