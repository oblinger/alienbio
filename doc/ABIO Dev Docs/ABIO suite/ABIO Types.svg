<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1360" viewBox="0 0 1200 680" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <polygon id="arrowhead-shape" points="0,0 10,5 0,10" fill="#1e1e1e"/>
    </marker>
  </defs>
  <rect id="bg" x="0" y="0" width="1200" height="680" fill="#ffffff"/>

  <g id="n-role">
    <rect id="n-role-box" x="20" y="30" width="190" height="56" rx="10" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-role-name" x="115" y="54" font-size="17" font-weight="600" text-anchor="middle">RoleSlot</text>
    <text id="n-role-kind" x="115" y="74" font-size="13" text-anchor="middle">name, type_tag, predicates</text>
  </g>
  <g id="n-motif">
    <rect id="n-motif-box" x="20" y="130" width="190" height="56" rx="10" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-motif-name" x="115" y="154" font-size="17" font-weight="600" text-anchor="middle">Motif</text>
    <text id="n-motif-kind" x="115" y="174" font-size="13" text-anchor="middle">roles, edges, params ‡</text>
  </g>
  <line id="e-role-motif" x1="115" y1="86" x2="115" y2="130" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <g id="n-carve">
    <rect id="n-carve-box" x="20" y="240" width="190" height="56" rx="10" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-carve-name" x="115" y="264" font-size="17" font-weight="600" text-anchor="middle">CarveResult</text>
    <text id="n-carve-kind" x="115" y="284" font-size="13" text-anchor="middle">motif + binding ‡</text>
  </g>
  <line id="e-motif-carve" x1="115" y1="186" x2="115" y2="240" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text id="l-motif-carve" x="125" y="218" font-size="13" fill="#1971c2" font-style="italic">carve / drafter</text>

  <g id="n-arch">
    <rect id="n-arch-box" x="290" y="110" width="250" height="96" rx="10" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-arch-name" x="415" y="136" font-size="17" font-weight="600" text-anchor="middle">TaskArchetype</text>
    <text id="n-arch-k1" x="415" y="158" font-size="13" text-anchor="middle">id, motif, verb, FeatureSet,</text>
    <text id="n-arch-k2" x="415" y="176" font-size="13" text-anchor="middle">recipe, drafter?,</text>
    <text id="n-arch-k3" x="415" y="194" font-size="13" text-anchor="middle">extra_answer_tokens</text>
  </g>
  <line id="e-motif-arch" x1="210" y1="158" x2="290" y2="158" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <g id="n-recipe">
    <rect id="n-recipe-box" x="290" y="250" width="250" height="76" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-recipe-name" x="415" y="274" font-size="17" font-weight="600" text-anchor="middle">ObjectiveRecipe</text>
    <text id="n-recipe-k1" x="415" y="294" font-size="13" text-anchor="middle">(Protocol) build_question,</text>
    <text id="n-recipe-k2" x="415" y="312" font-size="13" text-anchor="middle">build_key, grader_spec</text>
  </g>
  <line id="e-arch-recipe" x1="415" y1="206" x2="415" y2="250" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <line id="e-carve-recipe" x1="210" y1="275" x2="290" y2="285" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>

  <g id="n-q">
    <rect id="n-q-box" x="620" y="210" width="170" height="56" rx="10" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-q-name" x="705" y="234" font-size="17" font-weight="600" text-anchor="middle">Question</text>
    <text id="n-q-kind" x="705" y="254" font-size="13" text-anchor="middle">structured, kind</text>
  </g>
  <g id="n-ans">
    <rect id="n-ans-box" x="620" y="290" width="170" height="56" rx="10" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-ans-name" x="705" y="314" font-size="17" font-weight="600" text-anchor="middle">Answer</text>
    <text id="n-ans-kind" x="705" y="334" font-size="13" text-anchor="middle">value, kind ‡</text>
  </g>
  <g id="n-grader">
    <rect id="n-grader-box" x="620" y="370" width="170" height="56" rx="10" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-grader-name" x="705" y="394" font-size="17" font-weight="600" text-anchor="middle">GraderSpec</text>
    <text id="n-grader-kind" x="705" y="414" font-size="13" text-anchor="middle">kind, config ‡</text>
  </g>
  <line id="e-recipe-q" x1="540" y1="270" x2="620" y2="240" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line id="e-recipe-ans" x1="540" y1="300" x2="620" y2="315" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line id="e-recipe-grader" x1="520" y1="326" x2="620" y2="390" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>

  <g id="n-aobj">
    <rect id="n-aobj-box" x="860" y="330" width="170" height="56" rx="10" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-aobj-name" x="945" y="354" font-size="16" font-weight="600" text-anchor="middle">AnswerObjective</text>
    <text id="n-aobj-kind" x="945" y="374" font-size="13" text-anchor="middle">grader + key</text>
  </g>
  <line id="e-ans-aobj" x1="790" y1="325" x2="860" y2="350" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <line id="e-grader-aobj" x1="790" y1="395" x2="860" y2="370" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <g id="n-oobj">
    <rect id="n-oobj-box" x="860" y="430" width="170" height="56" rx="10" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-oobj-name" x="945" y="454" font-size="16" font-weight="600" text-anchor="middle">OutcomeObjective</text>
    <text id="n-oobj-kind" x="945" y="474" font-size="13" text-anchor="middle">scorer + target</text>
  </g>

  <g id="n-inst">
    <rect id="n-inst-box" x="860" y="110" width="200" height="96" rx="10" fill="#fff4e6" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-inst-name" x="960" y="136" font-size="17" font-weight="600" text-anchor="middle">TaskInstance</text>
    <text id="n-inst-k1" x="960" y="158" font-size="13" text-anchor="middle">archetype, world name,</text>
    <text id="n-inst-k2" x="960" y="176" font-size="13" text-anchor="middle">skeleton, objective,</text>
    <text id="n-inst-k3" x="960" y="194" font-size="13" text-anchor="middle">question, setup</text>
  </g>
  <line id="e-q-inst" x1="790" y1="230" x2="860" y2="190" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <path id="e-obj-inst" d="M 1030 358 L 1100 358 L 1100 200 L 1060 200" fill="none" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <path id="e-oobj-inst" d="M 1030 458 L 1100 458 L 1100 358" fill="none" stroke="#1e1e1e" stroke-width="3"/>
  <text id="l-obj-inst" x="1110" y="300" font-size="13" fill="#1971c2" font-style="italic">Objective</text>

  <g id="n-suite">
    <rect id="n-suite-box" x="860" y="20" width="200" height="56" rx="10" fill="#fff4e6" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-suite-name" x="960" y="44" font-size="17" font-weight="600" text-anchor="middle">Suite</text>
    <text id="n-suite-kind" x="960" y="64" font-size="13" text-anchor="middle">worlds, tasks</text>
  </g>
  <line id="e-inst-suite" x1="960" y1="110" x2="960" y2="76" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <g id="n-spec">
    <rect id="n-spec-box" x="560" y="20" width="200" height="56" rx="10" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-spec-name" x="660" y="44" font-size="17" font-weight="600" text-anchor="middle">SuiteSpec</text>
    <text id="n-spec-kind" x="660" y="64" font-size="13" text-anchor="middle">archetype_mix: Dist</text>
  </g>
  <line id="e-spec-suite" x1="760" y1="48" x2="860" y2="48" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text id="l-spec-suite" x="810" y="38" font-size="13" fill="#1971c2" font-style="italic" text-anchor="middle">build_suite</text>
  <line id="e-arch-spec" x1="500" y1="110" x2="600" y2="76" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>

  <g id="n-tl">
    <rect id="n-tl-box" x="20" y="430" width="250" height="76" rx="10" fill="#fff4e6" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-tl-name" x="145" y="456" font-size="17" font-weight="600" text-anchor="middle">Timeline</text>
    <text id="n-tl-k1" x="145" y="476" font-size="13" text-anchor="middle">times, states (lengths</text>
    <text id="n-tl-k2" x="145" y="494" font-size="13" text-anchor="middle">unchecked); from simulate</text>
  </g>
  <line id="e-tl-oobj" x1="270" y1="468" x2="860" y2="460" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <text id="l-tl-oobj" x="560" y="455" font-size="13" fill="#1971c2" font-style="italic" text-anchor="middle">scorer reads</text>
  <g id="n-op">
    <rect id="n-op-box" x="20" y="530" width="250" height="56" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-op-name" x="145" y="554" font-size="16" font-weight="600" text-anchor="middle">Op / ScriptedOp</text>
    <text id="n-op-kind" x="145" y="574" font-size="13" text-anchor="middle">the seam LLMOp also fills</text>
  </g>

  <g id="legend">
    <rect id="legend-box" x="15" y="615" width="1170" height="52" rx="8" fill="#ffffff" stroke="#868e96" stroke-width="1"/>
    <line id="legend-solid" x1="35" y1="641" x2="85" y2="641" stroke="#1e1e1e" stroke-width="3"/>
    <text id="legend-solid-text" x="95" y="646" font-size="14">builds</text>
    <line id="legend-dotted" x1="170" y1="641" x2="220" y2="641" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4"/>
    <text id="legend-dotted-text" x="230" y="646" font-size="14">contains, reads</text>
    <text id="legend-dagger" x="380" y="646" font-size="14">‡ frozen but holds a dict or list: mutable inside, and hash() raises TypeError</text>
  </g>
</svg>
