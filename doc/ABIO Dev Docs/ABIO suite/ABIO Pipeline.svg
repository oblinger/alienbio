<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1360" viewBox="0 0 1200 680" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <polygon id="arrowhead-shape" points="0,0 10,5 0,10" fill="#1e1e1e"/>
    </marker>
  </defs>
  <rect id="bg" x="0" y="0" width="1200" height="680" fill="#ffffff"/>

  <g id="n-spec">
    <rect id="n-spec-box" x="20" y="30" width="200" height="64" rx="10" fill="#fff4e6" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-spec-name" x="120" y="56" font-size="17" font-weight="600" text-anchor="middle">SuiteSpec</text>
    <text id="n-spec-kind" x="120" y="78" font-size="13" text-anchor="middle">archetype_mix</text>
  </g>
  <g id="n-sample">
    <rect id="n-sample-box" x="280" y="30" width="200" height="64" rx="10" fill="#bac8ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-sample-name" x="380" y="56" font-size="16" font-weight="600" text-anchor="middle">sample n_tasks</text>
    <text id="n-sample-kind" x="380" y="78" font-size="13" text-anchor="middle">seed.child("arch/i")</text>
  </g>
  <line id="e-spec-sample" x1="220" y1="62" x2="280" y2="62" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <g id="n-cover">
    <rect id="n-cover-box" x="540" y="30" width="200" height="64" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-cover-name" x="640" y="56" font-size="16" font-weight="600" text-anchor="middle">cover</text>
    <text id="n-cover-kind" x="640" y="78" font-size="13" text-anchor="middle">container index only</text>
  </g>
  <line id="e-sample-cover" x1="480" y1="62" x2="540" y2="62" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>

  <g id="n-gen">
    <rect id="n-gen-box" x="280" y="150" width="250" height="80" rx="10" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-gen-name" x="405" y="176" font-size="16" font-weight="600" text-anchor="middle">generated: drafter(seed)</text>
    <text id="n-gen-k1" x="405" y="198" font-size="13" text-anchor="middle">world, skeleton, objective?</text>
    <text id="n-gen-k2" x="405" y="216" font-size="13" text-anchor="middle">diagnose · predict · intervene</text>
  </g>
  <g id="n-carved">
    <rect id="n-carved-box" x="20" y="150" width="220" height="100" rx="10" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-carved-name" x="130" y="176" font-size="16" font-weight="600" text-anchor="middle">carved: draft_world</text>
    <text id="n-carved-k1" x="130" y="198" font-size="13" text-anchor="middle">molecule per role, reaction</text>
    <text id="n-carved-k2" x="130" y="216" font-size="13" text-anchor="middle">per edge, inert distractors</text>
    <text id="n-carved-k3" x="130" y="234" font-size="13" text-anchor="middle">= the motif itself ‡</text>
  </g>
  <line id="e-sample-gen" x1="380" y1="94" x2="400" y2="150" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line id="e-sample-carved" x1="320" y1="94" x2="180" y2="150" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>

  <g id="n-reject">
    <rect id="n-reject-box" x="20" y="300" width="220" height="80" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-reject-name" x="130" y="326" font-size="15" font-weight="600" text-anchor="middle">_draft_valid_world</text>
    <text id="n-reject-k1" x="130" y="348" font-size="13" text-anchor="middle">verify_with: simulate both,</text>
    <text id="n-reject-k2" x="130" y="366" font-size="13" text-anchor="middle">redraw ≤ max_redraws</text>
  </g>
  <line id="e-carved-reject" x1="130" y1="250" x2="130" y2="300" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <g id="n-carve">
    <rect id="n-carve-box" x="20" y="430" width="220" height="80" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-carve-name" x="130" y="456" font-size="15" font-weight="600" text-anchor="middle">carve + splice</text>
    <text id="n-carve-k1" x="130" y="478" font-size="13" text-anchor="middle">identity binding; added</text>
    <text id="n-carve-k2" x="130" y="496" font-size="13" text-anchor="middle">nodes refused</text>
  </g>
  <line id="e-reject-carve" x1="130" y1="380" x2="130" y2="430" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>

  <g id="n-obj">
    <rect id="n-obj-box" x="420" y="300" width="260" height="90" rx="10" fill="#bac8ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-obj-name" x="550" y="326" font-size="16" font-weight="600" text-anchor="middle">question + objective</text>
    <text id="n-obj-k1" x="550" y="348" font-size="13" text-anchor="middle">recipe.build_question;</text>
    <text id="n-obj-k2" x="550" y="366" font-size="13" text-anchor="middle">drafted objective, else key</text>
  </g>
  <line id="e-gen-obj" x1="460" y1="230" x2="520" y2="300" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line id="e-carve-obj" x1="240" y1="470" x2="440" y2="390" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text id="l-carve-obj" x="350" y="450" font-size="13" fill="#1971c2" font-style="italic" text-anchor="middle">skeleton</text>

  <g id="n-guard">
    <rect id="n-guard-box" x="760" y="290" width="260" height="110" rx="10" fill="#bac8ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-guard-name" x="890" y="316" font-size="15" font-weight="600" text-anchor="middle">_assert_task_consistent</text>
    <text id="n-guard-k1" x="890" y="338" font-size="13" text-anchor="middle">question round-trips;</text>
    <text id="n-guard-k2" x="890" y="356" font-size="13" text-anchor="middle">key round-trips, grades 1.0;</text>
    <text id="n-guard-k3" x="890" y="374" font-size="13" text-anchor="middle">outcome score in (0, 1]</text>
  </g>
  <line id="e-obj-guard" x1="680" y1="345" x2="760" y2="345" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <g id="n-vocab">
    <rect id="n-vocab-box" x="760" y="160" width="260" height="64" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-vocab-name" x="890" y="186" font-size="15" font-weight="600" text-anchor="middle">build_vocabulary</text>
    <text id="n-vocab-kind" x="890" y="208" font-size="13" text-anchor="middle">render / parse / grade</text>
  </g>
  <line id="e-guard-vocab" x1="890" y1="290" x2="890" y2="224" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>

  <g id="n-suite">
    <rect id="n-suite-box" x="760" y="460" width="260" height="90" rx="10" fill="#fff4e6" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-suite-name" x="890" y="486" font-size="17" font-weight="600" text-anchor="middle">Suite</text>
    <text id="n-suite-k1" x="890" y="508" font-size="13" text-anchor="middle">worlds; TaskInstance with</text>
    <text id="n-suite-k2" x="890" y="526" font-size="13" text-anchor="middle">setup {"container": i}</text>
  </g>
  <line id="e-guard-suite" x1="890" y1="400" x2="890" y2="460" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <path id="e-cover-suite" d="M 740 62 L 1100 62 L 1100 505 L 1020 505" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <text id="l-cover-suite" x="1110" y="280" font-size="13" fill="#1971c2" font-style="italic">assignment</text>

  <g id="legend">
    <rect id="legend-box" x="15" y="615" width="1170" height="52" rx="8" fill="#ffffff" stroke="#868e96" stroke-width="1"/>
    <line id="legend-solid" x1="35" y1="641" x2="85" y2="641" stroke="#1e1e1e" stroke-width="3"/>
    <text id="legend-solid-text" x="95" y="646" font-size="14">data flow</text>
    <line id="legend-dotted" x1="200" y1="641" x2="250" y2="641" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4"/>
    <text id="legend-dotted-text" x="260" y="646" font-size="14">calls, records</text>
    <text id="legend-dagger" x="400" y="646" font-size="14">‡ every reaction of the carved host lies on the answer path</text>
  </g>
</svg>
