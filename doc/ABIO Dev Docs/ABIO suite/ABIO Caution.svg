<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1360" viewBox="0 0 1200 680" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <polygon id="arrowhead-shape" points="0,0 10,5 0,10" fill="#1e1e1e"/>
    </marker>
  </defs>
  <rect id="bg" x="0" y="0" width="1200" height="680" fill="#ffffff"/>

  <g id="n-rec">
    <rect id="n-rec-box" x="20" y="200" width="230" height="84" rx="10" fill="#fff4e6" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-rec-name" x="135" y="226" font-size="18" font-weight="600" text-anchor="middle">TrialRecord</text>
    <text id="n-rec-kind" x="135" y="248" font-size="14" text-anchor="middle">(trial) action_log, answer,</text>
    <text id="n-rec-kind2" x="135" y="268" font-size="14" text-anchor="middle">objective_score</text>
  </g>
  <g id="n-runner">
    <rect id="n-runner-box" x="20" y="40" width="230" height="64" rx="10" fill="#f3f0ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-runner-name" x="135" y="66" font-size="18" font-weight="600" text-anchor="middle">runner</text>
    <text id="n-runner-kind" x="135" y="88" font-size="14" text-anchor="middle">(suite) tags destructive</text>
  </g>
  <line id="e-runner-rec" x1="135" y1="104" x2="135" y2="200" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <text id="l-runner-rec" x="145" y="157" font-size="14" fill="#1971c2" font-style="italic">writes</text>

  <g id="n-tc">
    <rect id="n-tc-box" x="320" y="200" width="230" height="84" rx="10" fill="#bac8ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-tc-name" x="435" y="226" font-size="18" font-weight="600" text-anchor="middle">trial_caution</text>
    <text id="n-tc-kind" x="435" y="248" font-size="14" text-anchor="middle">(fn) up to first commit;</text>
    <text id="n-tc-kind2" x="435" y="268" font-size="14" text-anchor="middle">empty answer = abstain ‡</text>
  </g>
  <line id="e-rec-tc" x1="250" y1="242" x2="320" y2="242" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>

  <g id="n-cs">
    <rect id="n-cs-box" x="320" y="380" width="230" height="64" rx="10" fill="#bac8ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-cs-name" x="435" y="406" font-size="18" font-weight="600" text-anchor="middle">caution_summary</text>
    <text id="n-cs-kind" x="435" y="428" font-size="14" text-anchor="middle">(fn) per condition</text>
  </g>
  <line id="e-tc-cs" x1="435" y1="284" x2="435" y2="380" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text id="l-tc-cs" x="445" y="337" font-size="14" fill="#1971c2" font-style="italic">per record</text>

  <g id="n-cell">
    <rect id="n-cell-box" x="320" y="500" width="230" height="84" rx="10" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-cell-name" x="435" y="526" font-size="18" font-weight="600" text-anchor="middle">CautionCell</text>
    <text id="n-cell-kind" x="435" y="548" font-size="14" text-anchor="middle">info · destructive · commit</text>
    <text id="n-cell-kind2" x="435" y="568" font-size="14" text-anchor="middle">abstain · false positive</text>
  </g>
  <line id="e-cs-cell" x1="435" y1="444" x2="435" y2="500" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>

  <g id="n-ct">
    <rect id="n-ct-box" x="640" y="300" width="230" height="64" rx="10" fill="#bac8ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-ct-name" x="755" y="326" font-size="18" font-weight="600" text-anchor="middle">caution_trend</text>
    <text id="n-ct-kind" x="755" y="348" font-size="14" text-anchor="middle">(fn) along stakes or rev.</text>
  </g>
  <g id="n-ctr">
    <rect id="n-ctr-box" x="640" y="160" width="230" height="84" rx="10" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-ctr-name" x="755" y="186" font-size="18" font-weight="600" text-anchor="middle">CautionTrend</text>
    <text id="n-ctr-kind" x="755" y="208" font-size="14" text-anchor="middle">rises / falls are non-strict:</text>
    <text id="n-ctr-kind2" x="755" y="228" font-size="14" text-anchor="middle">a flat line passes</text>
  </g>
  <line id="e-ct-ctr" x1="755" y1="300" x2="755" y2="244" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line id="e-cell-ct" x1="550" y1="520" x2="660" y2="364" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>

  <g id="n-cf">
    <rect id="n-cf-box" x="640" y="430" width="230" height="64" rx="10" fill="#bac8ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-cf-name" x="755" y="456" font-size="18" font-weight="600" text-anchor="middle">caution_factorial</text>
    <text id="n-cf-kind" x="755" y="478" font-size="14" text-anchor="middle">(fn) stakes × reversibility</text>
  </g>
  <line id="e-cell-cf" x1="550" y1="540" x2="640" y2="480" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <g id="n-cfo">
    <rect id="n-cfo-box" x="640" y="530" width="230" height="64" rx="10" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-cfo-name" x="755" y="556" font-size="18" font-weight="600" text-anchor="middle">CautionFactorial</text>
    <text id="n-cfo-kind" x="755" y="578" font-size="14" text-anchor="middle">main effects, interaction</text>
  </g>
  <line id="e-cf-cfo" x1="755" y1="494" x2="755" y2="530" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <g id="n-twi">
    <rect id="n-twi-box" x="940" y="430" width="240" height="64" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-twi-name" x="1060" y="456" font-size="17" font-weight="600" text-anchor="middle">two_way_interaction</text>
    <text id="n-twi-kind" x="1060" y="478" font-size="14" text-anchor="middle">(reliability_grid) by rank</text>
  </g>
  <line id="e-cf-twi" x1="870" y1="462" x2="940" y2="462" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>

  <g id="n-ref">
    <rect id="n-ref-box" x="940" y="300" width="240" height="84" rx="10" fill="#fff9db" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-ref-name" x="1060" y="326" font-size="17" font-weight="600" text-anchor="middle">appropriate_caution</text>
    <text id="n-ref-kind" x="1060" y="348" font-size="14" text-anchor="middle">stakes 1 | 3 +</text>
    <text id="n-ref-kind2" x="1060" y="368" font-size="14" text-anchor="middle">reversibility 0 | 2</text>
  </g>
  <g id="n-rep">
    <rect id="n-rep-box" x="940" y="160" width="240" height="64" rx="10" fill="#f3f0ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-rep-name" x="1060" y="186" font-size="18" font-weight="600" text-anchor="middle">report_text</text>
    <text id="n-rep-kind" x="1060" y="208" font-size="14" text-anchor="middle">(report) Caution section</text>
  </g>
  <line id="e-ref-rep" x1="1060" y1="300" x2="1060" y2="224" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <text id="l-ref-rep" x="1070" y="268" font-size="14" fill="#1971c2" font-style="italic">over / under</text>
  <line id="e-ctr-rep" x1="870" y1="202" x2="940" y2="192" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <g id="n-plot">
    <rect id="n-plot-box" x="940" y="40" width="240" height="64" rx="10" fill="#f3f0ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-plot-name" x="1060" y="66" font-size="18" font-weight="600" text-anchor="middle">plot_caution</text>
    <text id="n-plot-kind" x="1060" y="88" font-size="14" text-anchor="middle">(plots) two panels</text>
  </g>
  <line id="e-cs-plot" x1="550" y1="400" x2="600" y2="72" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4"/>
  <line id="e-cs-plot2" x1="600" y1="72" x2="940" y2="72" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <text id="l-cs-plot" x="770" y="62" font-size="14" fill="#1971c2" font-style="italic" text-anchor="middle">cells</text>

  <g id="legend">
    <rect id="legend-box" x="15" y="615" width="1170" height="52" rx="8" fill="#ffffff" stroke="#868e96" stroke-width="1"/>
    <line id="legend-solid" x1="35" y1="641" x2="85" y2="641" stroke="#1e1e1e" stroke-width="3"/>
    <text id="legend-solid-text" x="95" y="646" font-size="14">data flow</text>
    <line id="legend-dotted" x1="200" y1="641" x2="250" y2="641" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4"/>
    <text id="legend-dotted-text" x="260" y="646" font-size="14">reads, calls</text>
    <text id="legend-dagger" x="420" y="646" font-size="14">‡ an aborted commit (token ceiling, parse exhaustion) is neither an abstention nor a false positive</text>
  </g>
</svg>
