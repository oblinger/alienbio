<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1360" viewBox="0 0 1200 680" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <polygon id="arrowhead-shape" points="0,0 10,5 0,10" fill="#1e1e1e"/>
    </marker>
  </defs>
  <rect id="bg" x="0" y="0" width="1200" height="680" fill="#ffffff"/>

  <g id="n-dials">
    <rect id="n-dials-box" x="20" y="40" width="250" height="84" rx="10" fill="#fff9db" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-dials-name" x="145" y="66" font-size="17" font-weight="600" text-anchor="middle">MONITOR_DIALS</text>
    <text id="n-dials-kind" x="145" y="88" font-size="14" text-anchor="middle">coverage, sham, salience</text>
    <text id="n-dials-kind2" x="145" y="108" font-size="14" text-anchor="middle">(guarded, world-invariant)</text>
  </g>
  <g id="n-rm">
    <rect id="n-rm-box" x="340" y="50" width="230" height="64" rx="10" fill="#bac8ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-rm-name" x="455" y="76" font-size="18" font-weight="600" text-anchor="middle">resolve_monitor</text>
    <text id="n-rm-kind" x="455" y="98" font-size="14" text-anchor="middle">(fn) refuses + monitoring</text>
  </g>
  <line id="e-dials-rm" x1="270" y1="82" x2="340" y2="82" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <g id="n-cfg">
    <rect id="n-cfg-box" x="640" y="50" width="230" height="64" rx="10" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-cfg-name" x="755" y="76" font-size="18" font-weight="600" text-anchor="middle">MonitorConfig</text>
    <text id="n-cfg-kind" x="755" y="98" font-size="14" text-anchor="middle">or None: unmonitored</text>
  </g>
  <line id="e-rm-cfg" x1="570" y1="82" x2="640" y2="82" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <g id="n-guards">
    <rect id="n-guards-box" x="340" y="170" width="230" height="56" rx="10" fill="#f3f0ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-guards-name" x="455" y="194" font-size="17" font-weight="600" text-anchor="middle">guards preflight</text>
    <text id="n-guards-kind" x="455" y="215" font-size="14" text-anchor="middle">(guards) resolves early</text>
  </g>
  <line id="e-guards-rm" x1="455" y1="170" x2="455" y2="114" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>

  <g id="n-brief">
    <rect id="n-brief-box" x="940" y="40" width="240" height="84" rx="10" fill="#f3f0ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-brief-name" x="1060" y="66" font-size="18" font-weight="600" text-anchor="middle">build_brief</text>
    <text id="n-brief-kind" x="1060" y="88" font-size="14" text-anchor="middle">monitor line + auditor</text>
    <text id="n-brief-kind2" x="1060" y="108" font-size="14" text-anchor="middle">keys allowlisted</text>
  </g>
  <line id="e-cfg-brief" x1="870" y1="82" x2="940" y2="82" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <text id="l-cfg-brief" x="905" y="72" font-size="14" fill="#1971c2" font-style="italic" text-anchor="middle">text</text>

  <!-- runner turn loop -->
  <g id="n-loop">
    <rect id="n-loop-box" x="20" y="280" width="1160" height="210" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text id="n-loop-name" x="35" y="304" font-size="16" font-weight="600" fill="#343a40">runner turn t</text>
  </g>
  <g id="n-shows">
    <rect id="n-shows-box" x="40" y="320" width="220" height="64" rx="10" fill="#bac8ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-shows-name" x="150" y="346" font-size="18" font-weight="600" text-anchor="middle">shows_turn</text>
    <text id="n-shows-kind" x="150" y="368" font-size="14" text-anchor="middle">Bernoulli(salience)</text>
  </g>
  <g id="n-block">
    <rect id="n-block-box" x="330" y="320" width="240" height="64" rx="10" fill="#bac8ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-block-name" x="450" y="346" font-size="18" font-weight="600" text-anchor="middle">auditor_block</text>
    <text id="n-block-kind" x="450" y="368" font-size="14" text-anchor="middle">coverage + ledger count</text>
  </g>
  <line id="e-shows-block" x1="260" y1="352" x2="330" y2="352" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <g id="n-act">
    <rect id="n-act-box" x="640" y="320" width="200" height="64" rx="10" fill="#f3f0ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-act-name" x="740" y="346" font-size="18" font-weight="600" text-anchor="middle">agent.act</text>
    <text id="n-act-kind" x="740" y="368" font-size="14" text-anchor="middle">(agent) one action</text>
  </g>
  <line id="e-block-act" x1="570" y1="352" x2="640" y2="352" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text id="l-block-act" x="605" y="342" font-size="14" fill="#1971c2" font-style="italic" text-anchor="middle">obs</text>
  <g id="n-logs">
    <rect id="n-logs-box" x="910" y="320" width="250" height="64" rx="10" fill="#bac8ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-logs-name" x="1035" y="346" font-size="18" font-weight="600" text-anchor="middle">logs_turn</text>
    <text id="n-logs-kind" x="1035" y="368" font-size="14" text-anchor="middle">Bernoulli(coverage); sham: never ‡</text>
  </g>
  <line id="e-act-logs" x1="840" y1="352" x2="910" y2="352" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <g id="n-ledger">
    <rect id="n-ledger-box" x="640" y="415" width="300" height="60" rx="10" fill="#fff4e6" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-ledger-name" x="790" y="440" font-size="17" font-weight="600" text-anchor="middle">ledger += 1, log entry</text>
    <text id="n-ledger-kind" x="790" y="461" font-size="14" text-anchor="middle">(turn, kind, target, accepted)</text>
  </g>
  <line id="e-logs-ledger" x1="1035" y1="384" x2="940" y2="430" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line id="e-ledger-block" x1="640" y1="445" x2="450" y2="384" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <text id="l-ledger-block" x="520" y="440" font-size="14" fill="#1971c2" font-style="italic" text-anchor="middle">next turn</text>

  <line id="e-cfg-loop" x1="755" y1="114" x2="755" y2="280" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <text id="l-cfg-loop" x="765" y="200" font-size="14" fill="#1971c2" font-style="italic">per trial</text>

  <g id="n-record">
    <rect id="n-record-box" x="640" y="530" width="300" height="56" rx="10" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-record-name" x="790" y="554" font-size="17" font-weight="600" text-anchor="middle">TrialRecord.monitor</text>
    <text id="n-record-kind" x="790" y="575" font-size="14" text-anchor="middle">logged, shown, the log</text>
  </g>
  <line id="e-ledger-record" x1="790" y1="490" x2="790" y2="530" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>

  <g id="legend">
    <rect id="legend-box" x="15" y="615" width="1170" height="52" rx="8" fill="#ffffff" stroke="#868e96" stroke-width="1"/>
    <line id="legend-solid" x1="35" y1="641" x2="85" y2="641" stroke="#1e1e1e" stroke-width="3"/>
    <text id="legend-solid-text" x="95" y="646" font-size="14">flow</text>
    <line id="legend-dotted" x1="160" y1="641" x2="210" y2="641" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4"/>
    <text id="legend-dotted-text" x="220" y="646" font-size="14">reads, carries</text>
    <text id="legend-dagger" x="380" y="646" font-size="14">‡ a sham ledger stuck at 0 contradicts the announced coverage: (1 − c)^n after n turns</text>
  </g>
</svg>
