<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1360" viewBox="0 0 1200 680" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <polygon id="arrowhead-shape" points="0,0 10,5 0,10" fill="#1e1e1e"/>
    </marker>
  </defs>
  <rect id="bg" x="0" y="0" width="1200" height="680" fill="#ffffff"/>

  <g id="n-recm">
    <rect id="n-recm-box" x="20" y="120" width="240" height="64" rx="10" fill="#fff4e6" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-recm-name" x="140" y="146" font-size="18" font-weight="600" text-anchor="middle">match record</text>
    <text id="n-recm-kind" x="140" y="168" font-size="14" text-anchor="middle">(TrialRecord) arm, pair</text>
  </g>
  <g id="n-recx">
    <rect id="n-recx-box" x="20" y="300" width="240" height="64" rx="10" fill="#fff4e6" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-recx-name" x="140" y="326" font-size="18" font-weight="600" text-anchor="middle">mismatch record</text>
    <text id="n-recx-kind" x="140" y="348" font-size="14" text-anchor="middle">(TrialRecord) same seed</text>
  </g>
  <g id="n-dp">
    <rect id="n-dp-box" x="340" y="200" width="240" height="84" rx="10" fill="#bac8ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-dp-name" x="460" y="226" font-size="18" font-weight="600" text-anchor="middle">delta_pairs</text>
    <text id="n-dp-kind" x="460" y="248" font-size="14" text-anchor="middle">(fn) slot by condition</text>
    <text id="n-dp-kind2" x="460" y="268" font-size="14" text-anchor="middle">without arm, and pair id</text>
  </g>
  <line id="e-recm-dp" x1="260" y1="160" x2="340" y2="225" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line id="e-recx-dp" x1="260" y1="325" x2="340" y2="260" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text id="l-rec-dp" x="270" y="248" font-size="14" fill="#1971c2" font-style="italic">twins</text>

  <g id="n-fsd">
    <rect id="n-fsd-box" x="340" y="40" width="240" height="64" rx="10" fill="#bac8ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-fsd-name" x="460" y="66" font-size="17" font-weight="600" text-anchor="middle">final_state_divergence</text>
    <text id="n-fsd-kind" x="460" y="88" font-size="14" text-anchor="middle">(fn) d / (d + 1) ‡</text>
  </g>
  <line id="e-dp-fsd" x1="460" y1="200" x2="460" y2="104" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <text id="l-dp-fsd" x="470" y="157" font-size="14" fill="#1971c2" font-style="italic">per pair</text>

  <g id="n-pair">
    <rect id="n-pair-box" x="660" y="200" width="220" height="84" rx="10" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-pair-name" x="770" y="226" font-size="18" font-weight="600" text-anchor="middle">DeltaPair</text>
    <text id="n-pair-kind" x="770" y="248" font-size="14" text-anchor="middle">(dataclass) two scores,</text>
    <text id="n-pair-kind2" x="770" y="268" font-size="14" text-anchor="middle">one divergence</text>
  </g>
  <line id="e-dp-pair" x1="580" y1="242" x2="660" y2="242" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <g id="n-unp">
    <rect id="n-unp-box" x="340" y="380" width="240" height="56" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-unp-name" x="460" y="404" font-size="17" font-weight="600" text-anchor="middle">unpaired count</text>
    <text id="n-unp-kind" x="460" y="425" font-size="14" text-anchor="middle">(int) one arm only</text>
  </g>
  <line id="e-dp-unp" x1="460" y1="284" x2="460" y2="380" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>

  <g id="n-sum">
    <rect id="n-sum-box" x="660" y="380" width="220" height="56" rx="10" fill="#bac8ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-sum-name" x="770" y="404" font-size="18" font-weight="600" text-anchor="middle">delta_summary</text>
    <text id="n-sum-kind" x="770" y="425" font-size="14" text-anchor="middle">(fn) per condition</text>
  </g>
  <line id="e-pair-sum" x1="770" y1="284" x2="770" y2="380" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line id="e-unp-sum" x1="580" y1="408" x2="660" y2="408" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>

  <g id="n-cell">
    <rect id="n-cell-box" x="660" y="490" width="220" height="104" rx="10" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-cell-name" x="770" y="516" font-size="18" font-weight="600" text-anchor="middle">DeltaCell</text>
    <text id="n-cell-kind" x="770" y="538" font-size="14" text-anchor="middle">gap = match − mismatch</text>
    <text id="n-cell-kind2" x="770" y="558" font-size="14" text-anchor="middle">prior-following, world-tracking</text>
    <text id="n-cell-kind3" x="770" y="578" font-size="14" text-anchor="middle">mean divergence</text>
  </g>
  <line id="e-sum-cell" x1="770" y1="436" x2="770" y2="490" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>

  <g id="n-rep">
    <rect id="n-rep-box" x="960" y="420" width="220" height="64" rx="10" fill="#f3f0ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-rep-name" x="1070" y="446" font-size="18" font-weight="600" text-anchor="middle">report_text</text>
    <text id="n-rep-kind" x="1070" y="468" font-size="14" text-anchor="middle">(report) Delta section</text>
  </g>
  <g id="n-plot">
    <rect id="n-plot-box" x="960" y="530" width="220" height="64" rx="10" fill="#f3f0ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-plot-name" x="1070" y="556" font-size="18" font-weight="600" text-anchor="middle">plot_delta</text>
    <text id="n-plot-kind" x="1070" y="578" font-size="14" text-anchor="middle">(plots) n_pairs &gt; 0 only</text>
  </g>
  <line id="e-cell-rep" x1="880" y1="520" x2="960" y2="460" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <line id="e-cell-plot" x1="880" y1="562" x2="960" y2="562" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>

  <g id="n-gen">
    <rect id="n-gen-box" x="20" y="470" width="240" height="64" rx="10" fill="#f3f0ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-gen-name" x="140" y="496" font-size="18" font-weight="600" text-anchor="middle">delta drafter</text>
    <text id="n-gen-kind" x="140" y="518" font-size="14" text-anchor="middle">(DeltaGen) oracle["delta"]</text>
  </g>
  <line id="e-gen-recx" x1="140" y1="470" x2="140" y2="364" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <text id="l-gen-recx" x="150" y="422" font-size="14" fill="#1971c2" font-style="italic">arm, pair = seed</text>

  <g id="legend">
    <rect id="legend-box" x="15" y="615" width="1170" height="52" rx="8" fill="#ffffff" stroke="#868e96" stroke-width="1"/>
    <line id="legend-solid" x1="35" y1="641" x2="85" y2="641" stroke="#1e1e1e" stroke-width="3"/>
    <text id="legend-solid-text" x="95" y="646" font-size="14">data flow</text>
    <line id="legend-dotted" x1="200" y1="641" x2="250" y2="641" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4"/>
    <text id="legend-dotted-text" x="260" y="646" font-size="14">reads, calls</text>
    <text id="legend-dagger" x="420" y="646" font-size="14">‡ the two worlds differ by construction: ≈ 0.98 before any intervention</text>
  </g>
</svg>
