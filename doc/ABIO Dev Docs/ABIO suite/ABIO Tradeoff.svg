<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1360" viewBox="0 0 1200 680" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <polygon id="arrowhead-shape" points="0,0 10,5 0,10" fill="#1e1e1e"/>
    </marker>
  </defs>
  <rect id="bg" x="0" y="0" width="1200" height="680" fill="#ffffff"/>

  <!-- Draft time -->
  <g id="n-gen">
    <rect id="n-gen-box" x="20" y="40" width="240" height="64" rx="10" fill="#f3f0ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-gen-name" x="140" y="66" font-size="18" font-weight="600" text-anchor="middle">conflict drafter</text>
    <text id="n-gen-kind" x="140" y="88" font-size="14" text-anchor="middle">(ConflictGen) rung, priority</text>
  </g>
  <g id="n-co">
    <rect id="n-co-box" x="330" y="40" width="240" height="64" rx="10" fill="#bac8ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-co-name" x="450" y="66" font-size="18" font-weight="600" text-anchor="middle">conflict_oracle</text>
    <text id="n-co-kind" x="450" y="88" font-size="14" text-anchor="middle">(fn) supply off the world</text>
  </g>
  <line id="e-gen-co" x1="260" y1="72" x2="330" y2="72" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <g id="n-cff">
    <rect id="n-cff-box" x="640" y="40" width="250" height="64" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-cff-name" x="765" y="66" font-size="17" font-weight="600" text-anchor="middle">closed_form_frontier</text>
    <text id="n-cff-kind" x="765" y="88" font-size="14" text-anchor="middle">(ConflictGen) 11 samples</text>
  </g>
  <line id="e-co-cff" x1="570" y1="72" x2="640" y2="72" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <g id="n-orc">
    <rect id="n-orc-box" x="330" y="170" width="240" height="84" rx="10" fill="#fff9db" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-orc-name" x="450" y="196" font-size="17" font-weight="600" text-anchor="middle">oracle["conflict"]</text>
    <text id="n-orc-kind" x="450" y="218" font-size="14" text-anchor="middle">rung · targets · supply</text>
    <text id="n-orc-kind2" x="450" y="238" font-size="14" text-anchor="middle">frontier · priority</text>
  </g>
  <line id="e-co-orc" x1="450" y1="104" x2="450" y2="170" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text id="l-co-orc" x="460" y="142" font-size="14" fill="#1971c2" font-style="italic">stamped on task</text>

  <!-- Record time -->
  <g id="n-rec">
    <rect id="n-rec-box" x="20" y="300" width="240" height="64" rx="10" fill="#fff4e6" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-rec-name" x="140" y="326" font-size="18" font-weight="600" text-anchor="middle">TrialRecord</text>
    <text id="n-rec-kind" x="140" y="348" font-size="14" text-anchor="middle">(trial) oracle, final_state</text>
  </g>
  <line id="e-orc-rec" x1="330" y1="240" x2="210" y2="300" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <text id="l-orc-rec" x="240" y="262" font-size="14" fill="#1971c2" font-style="italic" text-anchor="end">carried</text>
  <g id="n-fv">
    <rect id="n-fv-box" x="20" y="440" width="240" height="64" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-fv-name" x="140" y="466" font-size="17" font-weight="600" text-anchor="middle">_final_value</text>
    <text id="n-fv-kind" x="140" y="488" font-size="14" text-anchor="middle">(fn) sum over cells</text>
  </g>
  <g id="n-cs">
    <rect id="n-cs-box" x="330" y="380" width="240" height="64" rx="10" fill="#bac8ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-cs-name" x="450" y="406" font-size="18" font-weight="600" text-anchor="middle">component_scores</text>
    <text id="n-cs-kind" x="450" y="428" font-size="14" text-anchor="middle">(fn) min(final / goal, 1)</text>
  </g>
  <line id="e-rec-cs" x1="260" y1="350" x2="330" y2="395" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line id="e-cs-fv" x1="330" y1="430" x2="260" y2="460" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>

  <g id="n-sum">
    <rect id="n-sum-box" x="640" y="300" width="250" height="64" rx="10" fill="#bac8ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-sum-name" x="765" y="326" font-size="18" font-weight="600" text-anchor="middle">conflict_summary</text>
    <text id="n-sum-kind" x="765" y="348" font-size="14" text-anchor="middle">(fn) per condition ‡</text>
  </g>
  <line id="e-cs-sum" x1="570" y1="400" x2="640" y2="350" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <g id="n-m33">
    <rect id="n-m33-box" x="640" y="170" width="250" height="84" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-m33-name" x="765" y="196" font-size="17" font-weight="600" text-anchor="middle">score_conflict (M33.6)</text>
    <text id="n-m33-kind" x="765" y="218" font-size="14" text-anchor="middle">dominant_objective, favors,</text>
    <text id="n-m33-kind2" x="765" y="238" font-size="14" text-anchor="middle">precedence_consistency</text>
  </g>
  <line id="e-sum-m33" x1="765" y1="300" x2="765" y2="254" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <g id="n-cell">
    <rect id="n-cell-box" x="640" y="430" width="250" height="104" rx="10" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-cell-name" x="765" y="456" font-size="18" font-weight="600" text-anchor="middle">ConflictCell</text>
    <text id="n-cell-kind" x="765" y="478" font-size="14" text-anchor="middle">mean attainment, dominant</text>
    <text id="n-cell-kind2" x="765" y="498" font-size="14" text-anchor="middle">or "tie", precedence,</text>
    <text id="n-cell-kind3" x="765" y="518" font-size="14" text-anchor="middle">Pareto distance</text>
  </g>
  <line id="e-sum-cell" x1="765" y1="364" x2="765" y2="430" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>

  <g id="n-pl">
    <rect id="n-pl-box" x="960" y="300" width="220" height="64" rx="10" fill="#bac8ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-pl-name" x="1070" y="326" font-size="18" font-weight="600" text-anchor="middle">precedence_ladder</text>
    <text id="n-pl-kind" x="1070" y="348" font-size="14" text-anchor="middle">(fn) across rungs</text>
  </g>
  <line id="e-cell-pl" x1="890" y1="460" x2="1000" y2="364" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <g id="n-rep">
    <rect id="n-rep-box" x="960" y="170" width="220" height="64" rx="10" fill="#f3f0ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-rep-name" x="1070" y="196" font-size="18" font-weight="600" text-anchor="middle">report_text</text>
    <text id="n-rep-kind" x="1070" y="218" font-size="14" text-anchor="middle">(report) section</text>
  </g>
  <line id="e-pl-rep" x1="1070" y1="300" x2="1070" y2="234" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <g id="n-plot">
    <rect id="n-plot-box" x="960" y="470" width="220" height="64" rx="10" fill="#f3f0ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-plot-name" x="1070" y="496" font-size="18" font-weight="600" text-anchor="middle">plot_conflict</text>
    <text id="n-plot-kind" x="1070" y="518" font-size="14" text-anchor="middle">(plots) by rung</text>
  </g>
  <line id="e-cell-plot" x1="890" y1="502" x2="960" y2="502" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>

  <g id="legend">
    <rect id="legend-box" x="15" y="615" width="1170" height="52" rx="8" fill="#ffffff" stroke="#868e96" stroke-width="1"/>
    <line id="legend-solid" x1="35" y1="641" x2="85" y2="641" stroke="#1e1e1e" stroke-width="3"/>
    <text id="legend-solid-text" x="95" y="646" font-size="14">data flow</text>
    <line id="legend-dotted" x1="200" y1="641" x2="250" y2="641" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4"/>
    <text id="legend-dotted-text" x="260" y="646" font-size="14">reads, calls</text>
    <text id="legend-dagger" x="420" y="646" font-size="14">‡ frontier_distance: to the polyline through the 11 samples, exact on the line</text>
  </g>
</svg>
