<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="840" viewBox="0 0 1200 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <polygon id="arrowhead-shape" points="0,0 10,5 0,10" fill="#1e1e1e"/>
    </marker>
  </defs>
  <rect id="bg" x="0" y="0" width="1200" height="420" fill="#ffffff"/>

  <g id="n-run">
    <rect id="n-run-box" x="20" y="60" width="240" height="80" rx="10" fill="#f3f0ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-run-name" x="140" y="86" font-size="18" font-weight="600" text-anchor="middle">runner.run</text>
    <text id="n-run-kind" x="140" y="108" font-size="14" text-anchor="middle">one per agent action;</text>
    <text id="n-run-kind2" x="140" y="128" font-size="14" text-anchor="middle">destructive only if accepted</text>
  </g>
  <g id="n-ar">
    <rect id="n-ar-box" x="340" y="40" width="260" height="120" rx="10" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-ar-name" x="470" y="66" font-size="18" font-weight="600" text-anchor="middle">ActionRecord</text>
    <text id="n-ar-k1" x="470" y="88" font-size="14" text-anchor="middle">(dataclass) kind, destructive,</text>
    <text id="n-ar-k2" x="470" y="108" font-size="14" text-anchor="middle">accepted, reason, target,</text>
    <text id="n-ar-k3" x="470" y="128" font-size="14" text-anchor="middle">value, delta</text>
  </g>
  <line id="e-run-ar" x1="260" y1="100" x2="340" y2="100" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>

  <g id="n-tr">
    <rect id="n-tr-box" x="680" y="60" width="240" height="80" rx="10" fill="#fff4e6" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-tr-name" x="800" y="86" font-size="18" font-weight="600" text-anchor="middle">TrialRecord</text>
    <text id="n-tr-kind" x="800" y="108" font-size="14" text-anchor="middle">(trial) action_log,</text>
    <text id="n-tr-kind2" x="800" y="128" font-size="14" text-anchor="middle">legal and illegal</text>
  </g>
  <line id="e-ar-tr" x1="600" y1="100" x2="680" y2="100" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <g id="n-store">
    <rect id="n-store-box" x="980" y="68" width="200" height="64" rx="10" fill="#fff4e6" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-store-name" x="1080" y="94" font-size="17" font-weight="600" text-anchor="middle">records.jsonl</text>
    <text id="n-store-kind" x="1080" y="116" font-size="14" text-anchor="middle">(store) round trip</text>
  </g>
  <line id="e-tr-store" x1="920" y1="100" x2="980" y2="100" stroke="#1e1e1e" stroke-width="3" marker-start="url(#arrowhead)" marker-end="url(#arrowhead)"/>

  <g id="n-fam">
    <rect id="n-fam-box" x="680" y="250" width="500" height="100" rx="10" fill="#f3f0ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-fam-name" x="930" y="276" font-size="18" font-weight="600" text-anchor="middle">analysis families (live readers)</text>
    <text id="n-fam-k1" x="930" y="300" font-size="14" text-anchor="middle">caution · hazard · census · degradation · faking · realism</text>
    <text id="n-fam-k2" x="930" y="322" font-size="14" text-anchor="middle">each reads action_log with its own rule,</text>
    <text id="n-fam-k3" x="930" y="342" font-size="14" text-anchor="middle">counting accepted actions</text>
  </g>
  <line id="e-tr-fam" x1="800" y1="140" x2="800" y2="250" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text id="l-tr-fam" x="810" y="200" font-size="14" fill="#1971c2" font-style="italic">action_log</text>

  <g id="legend">
    <rect id="legend-box" x="15" y="360" width="1170" height="52" rx="8" fill="#ffffff" stroke="#868e96" stroke-width="1"/>
    <line id="legend-solid" x1="35" y1="386" x2="85" y2="386" stroke="#1e1e1e" stroke-width="3"/>
    <text id="legend-solid-text" x="95" y="391" font-size="14">data flow</text>
    <text id="legend-note" x="260" y="391" font-size="14">the five generic metrics and TrialRecord's wrappers were retired in T093</text>
  </g>
</svg>
