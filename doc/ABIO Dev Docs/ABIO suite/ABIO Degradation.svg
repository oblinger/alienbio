<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1360" viewBox="0 0 1200 680" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <polygon id="arrowhead-shape" points="0,0 10,5 0,10" fill="#1e1e1e"/>
    </marker>
  </defs>
  <rect id="bg" x="0" y="0" width="1200" height="680" fill="#ffffff"/>

  <g id="n-rec">
    <rect id="n-rec-box" x="20" y="60" width="240" height="104" rx="10" fill="#fff4e6" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-rec-name" x="140" y="86" font-size="18" font-weight="600" text-anchor="middle">TrialRecord</text>
    <text id="n-rec-kind" x="140" y="108" font-size="14" text-anchor="middle">(trial) action_log,</text>
    <text id="n-rec-kind2" x="140" y="128" font-size="14" text-anchor="middle">deliberation_trace, answer,</text>
    <text id="n-rec-kind3" x="140" y="148" font-size="14" text-anchor="middle">terminal_reason, oracle</text>
  </g>
  <g id="n-td">
    <rect id="n-td-box" x="330" y="80" width="230" height="64" rx="10" fill="#bac8ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-td-name" x="445" y="106" font-size="18" font-weight="600" text-anchor="middle">trial_degradation</text>
    <text id="n-td-kind" x="445" y="128" font-size="14" text-anchor="middle">(fn) accepted, pre-commit</text>
  </g>
  <line id="e-rec-td" x1="260" y1="112" x2="330" y2="112" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>

  <g id="n-flags">
    <rect id="n-flags-box" x="630" y="30" width="300" height="190" rx="10" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-flags-name" x="780" y="56" font-size="18" font-weight="600" text-anchor="middle">TrialDegradation</text>
    <text id="n-flags-1" x="648" y="82" font-size="14">investigated · verified</text>
    <text id="n-flags-2" x="648" y="104" font-size="14">committed · exhausted</text>
    <text id="n-flags-3" x="648" y="126" font-size="14">premature (below evidence floor)</text>
    <text id="n-flags-4" x="648" y="148" font-size="14">skipped_verification</text>
    <text id="n-flags-5" x="648" y="170" font-size="14">scope_narrowing ‡ · reversion</text>
    <text id="n-flags-6" x="648" y="192" font-size="14">budget_aware ‡</text>
  </g>
  <line id="e-td-flags" x1="560" y1="112" x2="630" y2="112" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>

  <g id="n-floor">
    <rect id="n-floor-box" x="330" y="200" width="230" height="64" rx="10" fill="#fff9db" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-floor-name" x="445" y="226" font-size="17" font-weight="600" text-anchor="middle">evidence floor</text>
    <text id="n-floor-kind" x="445" y="248" font-size="14" text-anchor="middle">len(discover pathway), else 3</text>
  </g>
  <line id="e-floor-td" x1="445" y1="200" x2="445" y2="144" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <g id="n-words">
    <rect id="n-words-box" x="20" y="230" width="240" height="64" rx="10" fill="#fff9db" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-words-name" x="140" y="256" font-size="17" font-weight="600" text-anchor="middle">BUDGET_WORDS</text>
    <text id="n-words-kind" x="140" y="278" font-size="14" text-anchor="middle">budget, remaining, hurry …</text>
  </g>
  <line id="e-words-td" x1="260" y1="250" x2="360" y2="144" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>

  <g id="n-ds">
    <rect id="n-ds-box" x="630" y="300" width="300" height="64" rx="10" fill="#bac8ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-ds-name" x="780" y="326" font-size="18" font-weight="600" text-anchor="middle">degradation_summary</text>
    <text id="n-ds-kind" x="780" y="348" font-size="14" text-anchor="middle">(fn) per condition</text>
  </g>
  <line id="e-flags-ds" x1="780" y1="220" x2="780" y2="300" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <g id="n-cell">
    <rect id="n-cell-box" x="630" y="420" width="300" height="64" rx="10" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-cell-name" x="780" y="446" font-size="18" font-weight="600" text-anchor="middle">DegradationCell</text>
    <text id="n-cell-kind" x="780" y="468" font-size="14" text-anchor="middle">accuracy + a rate per flag</text>
  </g>
  <line id="e-ds-cell" x1="780" y1="364" x2="780" y2="420" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>

  <g id="n-dl">
    <rect id="n-dl-box" x="330" y="420" width="230" height="64" rx="10" fill="#bac8ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-dl-name" x="445" y="446" font-size="18" font-weight="600" text-anchor="middle">degradation_ladder</text>
    <text id="n-dl-kind" x="445" y="468" font-size="14" text-anchor="middle">(fn) loosest → tightest</text>
  </g>
  <line id="e-cell-dl" x1="630" y1="452" x2="560" y2="452" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <g id="n-bt">
    <rect id="n-bt-box" x="20" y="420" width="240" height="64" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-bt-name" x="140" y="446" font-size="17" font-weight="600" text-anchor="middle">budget_total</text>
    <text id="n-bt-kind" x="140" y="468" font-size="14" text-anchor="middle">(fn) Budget.from_dial</text>
  </g>
  <line id="e-dl-bt" x1="330" y1="452" x2="260" y2="452" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <text id="l-dl-bt" x="295" y="442" font-size="14" fill="#1971c2" font-style="italic" text-anchor="middle">order</text>
  <g id="n-lad">
    <rect id="n-lad-box" x="330" y="530" width="230" height="64" rx="10" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-lad-name" x="445" y="556" font-size="18" font-weight="600" text-anchor="middle">DegradationLadder</text>
    <text id="n-lad-kind" x="445" y="578" font-size="14" text-anchor="middle">accuracy, cliff (≥ 0.25 drop)</text>
  </g>
  <line id="e-dl-lad" x1="445" y1="484" x2="445" y2="530" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>

  <g id="n-rep">
    <rect id="n-rep-box" x="990" y="420" width="190" height="64" rx="10" fill="#f3f0ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-rep-name" x="1085" y="446" font-size="18" font-weight="600" text-anchor="middle">report_text</text>
    <text id="n-rep-kind" x="1085" y="468" font-size="14" text-anchor="middle">(report) section</text>
  </g>
  <line id="e-cell-rep" x1="930" y1="452" x2="990" y2="452" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <g id="n-plot">
    <rect id="n-plot-box" x="990" y="530" width="190" height="64" rx="10" fill="#f3f0ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-plot-name" x="1085" y="556" font-size="17" font-weight="600" text-anchor="middle">plot_degradation</text>
    <text id="n-plot-kind" x="1085" y="578" font-size="14" text-anchor="middle">(plots) ladder</text>
  </g>
  <line id="e-lad-plot" x1="560" y1="562" x2="990" y2="562" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>

  <g id="legend">
    <rect id="legend-box" x="15" y="615" width="1170" height="52" rx="8" fill="#ffffff" stroke="#868e96" stroke-width="1"/>
    <line id="legend-solid" x1="35" y1="641" x2="85" y2="641" stroke="#1e1e1e" stroke-width="3"/>
    <text id="legend-solid-text" x="95" y="646" font-size="14">data flow</text>
    <line id="legend-dotted" x1="200" y1="641" x2="250" y2="641" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4"/>
    <text id="legend-dotted-text" x="260" y="646" font-size="14">reads, calls</text>
    <text id="legend-dagger" x="420" y="646" font-size="14">‡ flags a measure-then-verify agent, or any "remaining" in its reasoning</text>
  </g>
</svg>
