<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1360" viewBox="0 0 1200 680" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <polygon id="arrowhead-shape" points="0,0 10,5 0,10" fill="#1e1e1e"/>
    </marker>
  </defs>
  <rect id="bg" x="0" y="0" width="1200" height="680" fill="#ffffff"/>

  <g id="n-heads">
    <rect id="n-heads-box" x="20" y="250" width="220" height="100" rx="10" fill="#f3f0ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-heads-name" x="130" y="276" font-size="17" font-weight="600" text-anchor="middle">drafters.py heads</text>
    <text id="n-heads-k1" x="130" y="298" font-size="14" text-anchor="middle">diagnose · predict ·</text>
    <text id="n-heads-k2" x="130" y="318" font-size="14" text-anchor="middle">intervene; then add</text>
    <text id="n-heads-k3" x="130" y="338" font-size="14" text-anchor="middle">EXP oracles</text>
  </g>

  <g id="n-gd">
    <rect id="n-gd-box" x="320" y="60" width="240" height="64" rx="10" fill="#bac8ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-gd-name" x="440" y="86" font-size="17" font-weight="600" text-anchor="middle">generative_diagnose</text>
    <text id="n-gd-kind" x="440" y="108" font-size="13" text-anchor="middle">(fn) node chosen per seed</text>
  </g>
  <g id="n-gp">
    <rect id="n-gp-box" x="320" y="268" width="240" height="64" rx="10" fill="#bac8ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-gp-name" x="440" y="294" font-size="17" font-weight="600" text-anchor="middle">generative_predict</text>
    <text id="n-gp-kind" x="440" y="316" font-size="13" text-anchor="middle">(fn) m0_m1 fixed, asserted</text>
  </g>
  <g id="n-gi">
    <rect id="n-gi-box" x="320" y="470" width="240" height="64" rx="10" fill="#bac8ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-gi-name" x="440" y="496" font-size="17" font-weight="600" text-anchor="middle">generative_intervene</text>
    <text id="n-gi-kind" x="440" y="518" font-size="13" text-anchor="middle">(fn) sim_cfg from the head ‡</text>
  </g>
  <line id="e-heads-gd" x1="200" y1="250" x2="340" y2="124" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <line id="e-heads-gp" x1="240" y1="300" x2="320" y2="300" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <line id="e-heads-gi" x1="200" y1="350" x2="340" y2="470" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>

  <g id="n-bd">
    <rect id="n-bd-box" x="640" y="30" width="270" height="56" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-bd-name" x="775" y="54" font-size="15" font-weight="600" text-anchor="middle">diagnose_perturbation</text>
    <text id="n-bd-kind" x="775" y="74" font-size="13" text-anchor="middle">bare factory: recipe + motif</text>
  </g>
  <g id="n-dd">
    <rect id="n-dd-box" x="640" y="100" width="270" height="56" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-dd-name" x="775" y="124" font-size="15" font-weight="600" text-anchor="middle">draft_diagnosis_world</text>
    <text id="n-dd-kind" x="775" y="144" font-size="13" text-anchor="middle">the attached drafter</text>
  </g>
  <line id="e-gd-bd" x1="560" y1="80" x2="640" y2="60" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <line id="e-gd-dd" x1="560" y1="105" x2="640" y2="125" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>

  <g id="n-bp">
    <rect id="n-bp-box" x="640" y="238" width="270" height="56" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-bp-name" x="775" y="262" font-size="15" font-weight="600" text-anchor="middle">predict_response</text>
    <text id="n-bp-kind" x="775" y="282" font-size="13" text-anchor="middle">+ up / down / same tokens</text>
  </g>
  <g id="n-dp">
    <rect id="n-dp-box" x="640" y="308" width="270" height="56" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-dp-name" x="775" y="332" font-size="15" font-weight="600" text-anchor="middle">draft_prediction_world</text>
    <text id="n-dp-kind" x="775" y="352" font-size="13" text-anchor="middle">rates vary, structure fixed</text>
  </g>
  <line id="e-gp-bp" x1="560" y1="290" x2="640" y2="270" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <line id="e-gp-dp" x1="560" y1="312" x2="640" y2="332" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>

  <g id="n-bi">
    <rect id="n-bi-box" x="640" y="430" width="270" height="56" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-bi-name" x="775" y="454" font-size="15" font-weight="600" text-anchor="middle">design_intervention(0.0)</text>
    <text id="n-bi-kind" x="775" y="474" font-size="13" text-anchor="middle">placeholder target_value</text>
  </g>
  <g id="n-di">
    <rect id="n-di-box" x="640" y="500" width="270" height="70" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-di-name" x="775" y="524" font-size="15" font-weight="600" text-anchor="middle">draft_intervention_world</text>
    <text id="n-di-k1" x="775" y="544" font-size="13" text-anchor="middle">goal = sink at the end</text>
    <text id="n-di-k2" x="775" y="560" font-size="13" text-anchor="middle">of sim_cfg ‡</text>
  </g>
  <line id="e-gi-bi" x1="560" y1="490" x2="640" y2="460" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <line id="e-gi-di" x1="560" y1="515" x2="640" y2="530" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>

  <g id="n-ta">
    <rect id="n-ta-box" x="980" y="230" width="200" height="140" rx="10" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-ta-name" x="1080" y="256" font-size="17" font-weight="600" text-anchor="middle">TaskArchetype</text>
    <text id="n-ta-k1" x="1080" y="280" font-size="13" text-anchor="middle">replace(base,</text>
    <text id="n-ta-k2" x="1080" y="298" font-size="13" text-anchor="middle">drafter=…)</text>
    <text id="n-ta-k3" x="1080" y="326" font-size="13" text-anchor="middle">→ build_suite</text>
    <text id="n-ta-k4" x="1080" y="344" font-size="13" text-anchor="middle">→ (world, task)</text>
  </g>
  <line id="e-dd-ta" x1="910" y1="128" x2="1010" y2="230" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line id="e-dp-ta" x1="910" y1="320" x2="980" y2="310" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line id="e-di-ta" x1="910" y1="520" x2="1010" y2="370" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>

  <g id="legend">
    <rect id="legend-box" x="15" y="615" width="1170" height="52" rx="8" fill="#ffffff" stroke="#868e96" stroke-width="1"/>
    <line id="legend-solid" x1="35" y1="641" x2="85" y2="641" stroke="#1e1e1e" stroke-width="3"/>
    <text id="legend-solid-text" x="95" y="646" font-size="14">data flow</text>
    <line id="legend-dotted" x1="200" y1="641" x2="250" y2="641" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4"/>
    <text id="legend-dotted-text" x="260" y="646" font-size="14">calls</text>
    <text id="legend-dagger" x="340" y="646" font-size="14">‡ the intervene head passes the episode horizon at dt 0.1 (T088); exp09: 12 s</text>
  </g>
</svg>
