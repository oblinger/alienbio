<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1360" viewBox="0 0 1200 680" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <polygon id="arrowhead-shape" points="0,0 10,5 0,10" fill="#1e1e1e"/>
    </marker>
  </defs>
  <rect id="bg" x="0" y="0" width="1200" height="680" fill="#ffffff"/>

  <!-- ReactionBlock family -->
  <g id="n-source">
    <rect id="n-source-box" x="20" y="20" width="170" height="56" rx="10" fill="#ebfbee" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-source-name" x="105" y="44" font-size="18" font-weight="600" text-anchor="middle">SourceBlock</text>
    <text id="n-source-kind" x="105" y="65" font-size="14" text-anchor="middle">(config) ∅ → pool</text>
  </g>
  <g id="n-sink">
    <rect id="n-sink-box" x="210" y="20" width="170" height="56" rx="10" fill="#ebfbee" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-sink-name" x="295" y="44" font-size="18" font-weight="600" text-anchor="middle">SinkBlock</text>
    <text id="n-sink-kind" x="295" y="65" font-size="14" text-anchor="middle">(config) pool → ∅</text>
  </g>
  <g id="n-pressure">
    <rect id="n-pressure-box" x="400" y="20" width="170" height="56" rx="10" fill="#ebfbee" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-pressure-name" x="485" y="44" font-size="18" font-weight="600" text-anchor="middle">PressureBlock</text>
    <text id="n-pressure-kind" x="485" y="65" font-size="14" text-anchor="middle">(sink) drain</text>
  </g>
  <g id="n-poisson">
    <rect id="n-poisson-box" x="640" y="110" width="170" height="56" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-poisson-name" x="725" y="134" font-size="18" font-weight="600" text-anchor="middle">PoissonSchedule</text>
    <text id="n-poisson-kind" x="725" y="155" font-size="14" text-anchor="middle">(config) lam, horizon</text>
  </g>
  <line id="e-pressure-poisson" x1="540" y1="76" x2="660" y2="110" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <text id="l-pressure-poisson" x="585" y="80" font-size="14" fill="#1971c2" font-style="italic">insult_times ‡</text>

  <g id="n-rxn">
    <rect id="n-rxn-box" x="210" y="160" width="200" height="56" rx="10" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-rxn-name" x="310" y="184" font-size="18" font-weight="600" text-anchor="middle">ReactionBlock</text>
    <text id="n-rxn-kind" x="310" y="205" font-size="14" text-anchor="middle">(primitive) one reaction</text>
  </g>
  <line id="e-source-rxn" x1="105" y1="76" x2="250" y2="160" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <line id="e-sink-rxn" x1="295" y1="76" x2="300" y2="160" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <text id="l-sink-rxn" x="305" y="125" font-size="14" fill="#1971c2" font-style="italic">subclass</text>
  <line id="e-pressure-rxn" x1="460" y1="76" x2="370" y2="160" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>

  <!-- Conflict crux and sweep -->
  <g id="n-crux">
    <rect id="n-crux-box" x="20" y="290" width="240" height="56" rx="10" fill="#ebfbee" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-crux-name" x="140" y="314" font-size="18" font-weight="600" text-anchor="middle">ConflictCruxBlock</text>
    <text id="n-crux-kind" x="140" y="335" font-size="14" text-anchor="middle">(pattern) (prodA, prodB)</text>
  </g>
  <line id="e-crux-rxn" x1="160" y1="290" x2="250" y2="216" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <text id="l-crux-rxn" x="60" y="250" font-size="14" fill="#1971c2" font-style="italic">2 routes + 2 sinks</text>
  <g id="n-sweep">
    <rect id="n-sweep-box" x="20" y="430" width="240" height="56" rx="10" fill="#f3f0ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-sweep-name" x="140" y="454" font-size="18" font-weight="600" text-anchor="middle">sweep_conflict_frontier</text>
    <text id="n-sweep-kind" x="140" y="475" font-size="14" text-anchor="middle">(fn) points over (kA, kB)</text>
  </g>
  <line id="e-sweep-crux" x1="140" y1="430" x2="140" y2="346" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <text id="l-sweep-crux" x="150" y="393" font-size="14" fill="#1971c2" font-style="italic">oracle each</text>

  <!-- Modifier blocks -->
  <g id="n-modgroup">
    <rect id="n-modgroup-box" x="850" y="15" width="335" height="350" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text id="n-modgroup-name" x="865" y="38" font-size="16" font-weight="600" fill="#343a40">modifier blocks</text>
  </g>
  <g id="n-signal">
    <rect id="n-signal-box" x="865" y="50" width="305" height="44" rx="8" fill="#ebfbee" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-signal-name" x="1017" y="78" font-size="16" font-weight="600" text-anchor="middle">SignalingBlock · activator | inhibitor</text>
  </g>
  <g id="n-inhib">
    <rect id="n-inhib-box" x="865" y="102" width="305" height="44" rx="8" fill="#ebfbee" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-inhib-name" x="1017" y="130" font-size="16" font-weight="600" text-anchor="middle">InhibitionBlock · inhibitor</text>
  </g>
  <g id="n-enzyme">
    <rect id="n-enzyme-box" x="865" y="154" width="305" height="44" rx="8" fill="#ebfbee" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-enzyme-name" x="1017" y="182" font-size="16" font-weight="600" text-anchor="middle">EnzymeBlock · michaelis</text>
  </g>
  <g id="n-coop">
    <rect id="n-coop-box" x="865" y="206" width="305" height="44" rx="8" fill="#ebfbee" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-coop-name" x="1017" y="234" font-size="16" font-weight="600" text-anchor="middle">CooperativeBindingBlock · hill</text>
  </g>
  <g id="n-modfrag">
    <rect id="n-modfrag-box" x="865" y="296" width="305" height="56" rx="10" fill="#bac8ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-modfrag-name" x="1017" y="320" font-size="18" font-weight="600" text-anchor="middle">_modulator_fragment</text>
    <text id="n-modfrag-kind" x="1017" y="341" font-size="14" text-anchor="middle">(fn) reaction + Modulation</text>
  </g>
  <line id="e-coop-modfrag" x1="1017" y1="250" x2="1017" y2="296" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text id="l-coop-modfrag" x="1027" y="279" font-size="14" fill="#1971c2" font-style="italic">all four realize</text>

  <!-- Leaf and transport blocks -->
  <g id="n-leafgroup">
    <rect id="n-leafgroup-box" x="700" y="400" width="485" height="120" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text id="n-leafgroup-name" x="735" y="423" font-size="16" font-weight="600" fill="#343a40">compartment-declaring blocks · flows, laws</text>
  </g>
  <g id="n-transport">
    <rect id="n-transport-box" x="712" y="440" width="135" height="64" rx="10" fill="#ebfbee" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-transport-name" x="779" y="465" font-size="16" font-weight="600" text-anchor="middle">TransportBlock</text>
    <text id="n-transport-kind" x="779" y="488" font-size="14" text-anchor="middle">1 port, 1 flux</text>
  </g>
  <g id="n-lattice">
    <rect id="n-lattice-box" x="857" y="440" width="165" height="64" rx="10" fill="#ebfbee" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-lattice-name" x="939" y="465" font-size="16" font-weight="600" text-anchor="middle">SpatialLatticeBlock</text>
    <text id="n-lattice-kind" x="939" y="488" font-size="14" text-anchor="middle">(leaf) k cells</text>
  </g>
  <g id="n-pop">
    <rect id="n-pop-box" x="1032" y="440" width="148" height="64" rx="10" fill="#ebfbee" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-pop-name" x="1106" y="465" font-size="15" font-weight="600" text-anchor="middle">PopulationBlock</text>
    <text id="n-pop-kind" x="1106" y="488" font-size="14" text-anchor="middle">(leaf) count</text>
  </g>

  <!-- Fragment and materialize -->
  <g id="n-frag">
    <rect id="n-frag-box" x="350" y="420" width="290" height="64" rx="10" fill="#bac8ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-frag-name" x="495" y="446" font-size="18" font-weight="600" text-anchor="middle">Fragment</text>
    <text id="n-frag-kind" x="495" y="468" font-size="14" text-anchor="middle">(skeleton) one per realize</text>
  </g>
  <line id="e-rxn-frag" x1="330" y1="216" x2="460" y2="420" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text id="l-rxn-frag" x="395" y="300" font-size="14" fill="#1971c2" font-style="italic">reaction</text>
  <line id="e-modfrag-frag" x1="865" y1="335" x2="620" y2="420" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text id="l-modfrag-frag" x="690" y="352" font-size="14" fill="#1971c2" font-style="italic">modulated reaction</text>
  <line id="e-leaf-frag" x1="700" y1="460" x2="640" y2="460" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>

  <g id="n-mat">
    <rect id="n-mat-box" x="380" y="540" width="200" height="56" rx="10" fill="#fff4e6" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-mat-name" x="480" y="564" font-size="18" font-weight="600" text-anchor="middle">materialize</text>
    <text id="n-mat-kind" x="480" y="585" font-size="14" text-anchor="middle">(Skeleton) merged → world</text>
  </g>
  <line id="e-frag-mat" x1="480" y1="484" x2="480" y2="540" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text id="l-frag-mat" x="490" y="517" font-size="14" fill="#1971c2" font-style="italic">merge</text>

  <!-- Legend -->
  <g id="legend">
    <rect id="legend-box" x="15" y="615" width="1170" height="52" rx="8" fill="#ffffff" stroke="#868e96" stroke-width="1"/>
    <line id="legend-solid" x1="35" y1="641" x2="85" y2="641" stroke="#1e1e1e" stroke-width="3"/>
    <text id="legend-solid-text" x="95" y="646" font-size="14">realize emits</text>
    <line id="legend-dotted" x1="230" y1="641" x2="280" y2="641" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4"/>
    <text id="legend-dotted-text" x="290" y="646" font-size="14">subclass, contains, calls</text>
    <text id="legend-dagger" x="520" y="646" font-size="14">‡ metadata only, written onto the authored block</text>
  </g>
</svg>
