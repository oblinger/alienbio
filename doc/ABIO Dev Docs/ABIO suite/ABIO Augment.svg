<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1360" viewBox="0 0 1200 680" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <polygon id="arrowhead-shape" points="0,0 10,5 0,10" fill="#1e1e1e"/>
    </marker>
  </defs>
  <rect id="bg" x="0" y="0" width="1200" height="680" fill="#ffffff"/>

  <g id="n-world">
    <rect id="n-world-box" x="20" y="60" width="220" height="80" rx="10" fill="#fff4e6" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-world-name" x="130" y="86" font-size="18" font-weight="600" text-anchor="middle">WorldImpl</text>
    <text id="n-world-kind" x="130" y="108" font-size="14" text-anchor="middle">existing nodes reused</text>
    <text id="n-world-kind2" x="130" y="128" font-size="14" text-anchor="middle">by identity</text>
  </g>
  <g id="n-targets">
    <rect id="n-targets-box" x="20" y="220" width="220" height="80" rx="10" fill="#fff4e6" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-targets-name" x="130" y="246" font-size="18" font-weight="600" text-anchor="middle">TargetStats</text>
    <text id="n-targets-kind" x="130" y="268" font-size="14" text-anchor="middle">stat → (target, tol);</text>
    <text id="n-targets-kind2" x="130" y="288" font-size="14" text-anchor="middle">unknown keys skipped ‡</text>
  </g>
  <g id="n-loop">
    <rect id="n-loop-box" x="320" y="120" width="260" height="120" rx="10" fill="#bac8ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-loop-name" x="450" y="146" font-size="18" font-weight="600" text-anchor="middle">augment loop</text>
    <text id="n-loop-k1" x="450" y="170" font-size="13" text-anchor="middle">one action per iteration,</text>
    <text id="n-loop-k2" x="450" y="188" font-size="13" text-anchor="middle">≤ max_iters; additions only;</text>
    <text id="n-loop-k3" x="450" y="206" font-size="13" text-anchor="middle">no action → stop, warn</text>
    <text id="n-loop-k4" x="450" y="224" font-size="13" text-anchor="middle">(never raises) ‡</text>
  </g>
  <line id="e-world-loop" x1="240" y1="100" x2="320" y2="150" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line id="e-targets-loop" x1="240" y1="260" x2="320" y2="215" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>

  <g id="n-gs">
    <rect id="n-gs-box" x="320" y="330" width="260" height="80" rx="10" fill="#bac8ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-gs-name" x="450" y="356" font-size="18" font-weight="600" text-anchor="middle">graph_stats</text>
    <text id="n-gs-kind" x="450" y="378" font-size="13" text-anchor="middle">n_species, n_reactions,</text>
    <text id="n-gs-kind2" x="450" y="398" font-size="13" text-anchor="middle">mean_degree (neighbors)</text>
  </g>
  <line id="e-loop-gs" x1="450" y1="240" x2="450" y2="330" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <text id="l-loop-gs" x="460" y="290" font-size="13" fill="#1971c2" font-style="italic">each iteration</text>

  <g id="n-fs">
    <rect id="n-fs-box" x="660" y="40" width="250" height="64" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-fs-name" x="785" y="66" font-size="16" font-weight="600" text-anchor="middle">1. filler molecule</text>
    <text id="n-fs-kind" x="785" y="88" font-size="13" text-anchor="middle">fill_s&lt;k&gt; while n_species low</text>
  </g>
  <g id="n-fr">
    <rect id="n-fr-box" x="660" y="130" width="250" height="64" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-fr-name" x="785" y="156" font-size="16" font-weight="600" text-anchor="middle">2. filler reaction</text>
    <text id="n-fr-kind" x="785" y="178" font-size="13" text-anchor="middle">fill_r&lt;k&gt;, empty, rate 1.0</text>
  </g>
  <g id="n-fe">
    <rect id="n-fe-box" x="660" y="220" width="250" height="64" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-fe-name" x="785" y="246" font-size="16" font-weight="600" text-anchor="middle">3. filler edge</text>
    <text id="n-fe-kind" x="785" y="268" font-size="13" text-anchor="middle">filler mol → filler rxn reactant</text>
  </g>
  <g id="n-fo">
    <rect id="n-fo-box" x="660" y="310" width="250" height="64" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-fo-name" x="785" y="336" font-size="16" font-weight="600" text-anchor="middle">degree too high</text>
    <text id="n-fo-kind" x="785" y="358" font-size="13" text-anchor="middle">add a node of an unpinned count</text>
  </g>
  <line id="e-loop-fs" x1="580" y1="140" x2="660" y2="72" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <line id="e-loop-fr" x1="580" y1="165" x2="660" y2="162" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <line id="e-loop-fe" x1="580" y1="200" x2="660" y2="250" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>
  <line id="e-loop-fo" x1="560" y1="240" x2="680" y2="310" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrowhead)"/>

  <g id="n-out">
    <rect id="n-out-box" x="980" y="160" width="200" height="100" rx="10" fill="#fff4e6" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-out-name" x="1080" y="186" font-size="17" font-weight="600" text-anchor="middle">new WorldImpl</text>
    <text id="n-out-k1" x="1080" y="208" font-size="13" text-anchor="middle">"augmented" chemistry,</text>
    <text id="n-out-k2" x="1080" y="226" font-size="13" text-anchor="middle">rebuild_world keeps</text>
    <text id="n-out-k3" x="1080" y="244" font-size="13" text-anchor="middle">flows, pop. laws</text>
  </g>
  <line id="e-fe-out" x1="910" y1="235" x2="980" y2="220" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>

  <g id="n-callers">
    <rect id="n-callers-box" x="20" y="460" width="560" height="64" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6 4"/>
    <text id="n-callers-name" x="300" y="486" font-size="16" font-weight="600" text-anchor="middle">callers: tests/suite/test_augment.py, the re-export</text>
    <text id="n-callers-kind" x="300" y="508" font-size="13" text-anchor="middle">no drafter, pipeline step or Expr head</text>
  </g>

  <g id="legend">
    <rect id="legend-box" x="15" y="615" width="1170" height="52" rx="8" fill="#ffffff" stroke="#868e96" stroke-width="1"/>
    <line id="legend-solid" x1="35" y1="641" x2="85" y2="641" stroke="#1e1e1e" stroke-width="3"/>
    <text id="legend-solid-text" x="95" y="646" font-size="14">data flow</text>
    <line id="legend-dotted" x1="200" y1="641" x2="250" y2="641" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 4"/>
    <text id="legend-dotted-text" x="260" y="646" font-size="14">calls, actions</text>
    <text id="legend-dagger" x="400" y="646" font-size="14">‡ "n_specie" is skipped as met; a target below today's value only logs</text>
  </g>
</svg>
