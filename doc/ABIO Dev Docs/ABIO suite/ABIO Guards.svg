<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1360" viewBox="0 0 1200 680" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <polygon id="arrowhead-shape" points="0,0 10,5 0,10" fill="#1e1e1e"/>
    </marker>
  </defs>
  <rect id="bg" x="0" y="0" width="1200" height="680" fill="#ffffff"/>

  <!-- Input: the spec -->
  <g id="n-spec">
    <rect id="n-spec-box" x="20" y="180" width="200" height="164" rx="10" fill="#fff3f3" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-spec-name" x="120" y="212" font-size="18" font-weight="600" text-anchor="middle">ExperimentSpec</text>
    <text id="n-spec-kind" x="120" y="234" font-size="14" text-anchor="middle">(dataclass) the run</text>
    <text id="n-spec-f1" x="120" y="266" font-size="14" text-anchor="middle">axes · fixed_dials</text>
    <text id="n-spec-f2" x="120" y="288" font-size="14" text-anchor="middle">drafter_kwargs</text>
    <text id="n-spec-f3" x="120" y="310" font-size="14" text-anchor="middle">agent · model</text>
    <text id="n-spec-f4" x="120" y="332" font-size="14" text-anchor="middle">registration</text>
  </g>
  <line id="e-spec" x1="220" y1="262" x2="280" y2="262" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text id="e-spec-label" x="250" y="252" font-size="14" fill="#1864ab" font-style="italic" text-anchor="middle">spec</text>

  <!-- The gate: preflight and its ordered check groups -->
  <g id="n-preflight">
    <rect id="n-preflight-box" x="280" y="20" width="400" height="500" rx="12" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-preflight-name" x="480" y="48" font-size="18" font-weight="600" text-anchor="middle">preflight</text>
    <text id="n-preflight-kind" x="480" y="70" font-size="14" text-anchor="middle">(fn) 19 checks, top to bottom</text>
  </g>
  <g id="b-licence">
    <rect id="b-licence-box" x="292" y="82" width="376" height="60" rx="8" fill="#ebfbee" stroke="#1e1e1e" stroke-width="1.5"/>
    <text id="b-licence-name" x="304" y="106" font-size="18" font-weight="600">1 licence</text>
    <text id="b-licence-checks" x="304" y="130" font-size="14">registration · no-peeking</text>
  </g>
  <g id="b-dials">
    <rect id="b-dials-box" x="292" y="152" width="376" height="60" rx="8" fill="#ebfbee" stroke="#1e1e1e" stroke-width="1.5"/>
    <text id="b-dials-name" x="304" y="176" font-size="18" font-weight="600">2 dial placement</text>
    <text id="b-dials-checks" x="304" y="200" font-size="14">dials · labels · episode-dials · surface · sampling</text>
  </g>
  <g id="b-cross">
    <rect id="b-cross-box" x="292" y="222" width="376" height="80" rx="8" fill="#ebfbee" stroke="#1e1e1e" stroke-width="1.5"/>
    <text id="b-cross-name" x="304" y="246" font-size="18" font-weight="600">3 cross-constraints</text>
    <text id="b-cross-checks1" x="304" y="270" font-size="14">w2-lag · brief-dials · certainty-windows</text>
    <text id="b-cross-checks2" x="304" y="290" font-size="14">score-window · intervene-horizon · inert-arm · agent</text>
  </g>
  <g id="b-price">
    <rect id="b-price-box" x="292" y="312" width="376" height="60" rx="8" fill="#ebfbee" stroke="#1e1e1e" stroke-width="1.5"/>
    <text id="b-price-name" x="304" y="336" font-size="18" font-weight="600">4 price</text>
    <text id="b-price-checks" x="304" y="360" font-size="14">estimate_cost: a price for every model level</text>
  </g>
  <g id="b-draft">
    <rect id="b-draft-box" x="292" y="382" width="376" height="60" rx="8" fill="#ebfbee" stroke="#1e1e1e" stroke-width="1.5"/>
    <text id="b-draft-name" x="304" y="406" font-size="18" font-weight="600">5 draft</text>
    <text id="b-draft-checks" x="304" y="430" font-size="14">skipped once any check above refused</text>
  </g>
  <g id="b-disk">
    <rect id="b-disk-box" x="292" y="452" width="376" height="60" rx="8" fill="#ebfbee" stroke="#1e1e1e" stroke-width="1.5"/>
    <text id="b-disk-name" x="304" y="476" font-size="18" font-weight="600">6 on disk</text>
    <text id="b-disk-checks" x="304" y="500" font-size="14">records-readable · resume · out_dir</text>
  </g>

  <!-- What each group reads -->
  <g id="r-registry">
    <rect id="r-registry-box" x="770" y="82" width="410" height="60" rx="10" fill="#fff9db" stroke="#1e1e1e" stroke-width="2"/>
    <text id="r-registry-name" x="782" y="106" font-size="18" font-weight="600">catalog/registrations.yaml</text>
    <text id="r-registry-kind" x="782" y="130" font-size="14">(file) commit-tracked licences, pinned by a test</text>
  </g>
  <g id="r-heads">
    <rect id="r-heads-box" x="770" y="152" width="410" height="60" rx="10" fill="#fff9db" stroke="#1e1e1e" stroke-width="2"/>
    <text id="r-heads-name" x="782" y="176" font-size="18" font-weight="600">drafter heads</text>
    <text id="r-heads-kind" x="782" y="200" font-size="14">(registry) dial_params · guarded · runtime_dials</text>
  </g>
  <g id="r-defaults">
    <rect id="r-defaults-box" x="770" y="232" width="410" height="60" rx="10" fill="#fff9db" stroke="#1e1e1e" stroke-width="2"/>
    <text id="r-defaults-name" x="782" y="256" font-size="18" font-weight="600">run defaults · per-condition dials</text>
    <text id="r-defaults-kind" x="782" y="280" font-size="14">(signature) runner.run sim_cfg · max_turns</text>
  </g>
  <g id="r-price">
    <rect id="r-price-box" x="770" y="312" width="410" height="60" rx="10" fill="#fff9db" stroke="#1e1e1e" stroke-width="2"/>
    <text id="r-price-name" x="782" y="336" font-size="18" font-weight="600">price table</text>
    <text id="r-price-kind" x="782" y="360" font-size="14">(llm_agent.price_for) or price_usd_per_mtok</text>
  </g>
  <g id="r-worlds">
    <rect id="r-worlds-box" x="770" y="382" width="410" height="60" rx="10" fill="#fff9db" stroke="#1e1e1e" stroke-width="2"/>
    <text id="r-worlds-name" x="782" y="406" font-size="18" font-weight="600">one drafted world per condition</text>
    <text id="r-worlds-kind" x="782" y="430" font-size="14">(DRAFTERS) at that condition's first-trial seed</text>
  </g>
  <g id="r-outdir">
    <rect id="r-outdir-box" x="770" y="452" width="410" height="60" rx="10" fill="#fff9db" stroke="#1e1e1e" stroke-width="2"/>
    <text id="r-outdir-name" x="782" y="476" font-size="18" font-weight="600">out_dir</text>
    <text id="r-outdir-kind" x="782" y="500" font-size="14">(directory) records.jsonl · manifest.json</text>
  </g>
  <line id="e-read-registry" x1="680" y1="112" x2="770" y2="112" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrowhead)"/>
  <line id="e-read-heads" x1="680" y1="182" x2="770" y2="182" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrowhead)"/>
  <line id="e-read-defaults" x1="680" y1="262" x2="770" y2="262" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrowhead)"/>
  <line id="e-read-price" x1="680" y1="342" x2="770" y2="342" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrowhead)"/>
  <line id="e-read-worlds" x1="680" y1="412" x2="770" y2="412" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrowhead)"/>
  <line id="e-read-outdir" x1="680" y1="482" x2="770" y2="482" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrowhead)"/>

  <!-- Result and the two exits -->
  <g id="n-result">
    <rect id="n-result-box" x="330" y="572" width="300" height="60" rx="10" fill="#e7f5ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-result-name" x="480" y="597" font-size="18" font-weight="600" text-anchor="middle">Preflight</text>
    <text id="n-result-kind" x="480" y="620" font-size="14" text-anchor="middle">(dataclass) checks · estimate · refusal</text>
  </g>
  <line id="e-result" x1="480" y1="520" x2="480" y2="572" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text id="e-result-label" x="492" y="550" font-size="14" fill="#1864ab" font-style="italic">verdicts</text>

  <g id="n-dry">
    <rect id="n-dry-box" x="20" y="572" width="240" height="60" rx="10" fill="#e7f5ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-dry-name" x="140" y="597" font-size="18" font-weight="600" text-anchor="middle">bio suite run --dry</text>
    <text id="n-dry-kind" x="140" y="620" font-size="14" text-anchor="middle">(CLI) every verdict; exit 1</text>
  </g>
  <line id="e-dry" x1="330" y1="602" x2="260" y2="602" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text id="e-dry-label" x="295" y="592" font-size="14" fill="#1864ab" font-style="italic" text-anchor="middle">lines</text>

  <g id="n-run">
    <rect id="n-run-box" x="700" y="572" width="260" height="60" rx="10" fill="#e7f5ff" stroke="#1e1e1e" stroke-width="2"/>
    <text id="n-run-name" x="830" y="597" font-size="18" font-weight="600" text-anchor="middle">run_experiment</text>
    <text id="n-run-kind" x="830" y="620" font-size="14" text-anchor="middle">(fn) raises the first refusal</text>
  </g>
  <line id="e-run" x1="630" y1="602" x2="700" y2="602" stroke="#1e1e1e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text id="e-run-label" x="665" y="592" font-size="14" fill="#1864ab" font-style="italic" text-anchor="middle">refusal</text>

  <!-- Legend -->
  <g id="legend">
    <line id="legend-solid" x1="20" y1="658" x2="60" y2="658" stroke="#1e1e1e" stroke-width="3"/>
    <text id="legend-solid-text" x="68" y="663" font-size="14">order of the gate</text>
    <line id="legend-dotted" x1="200" y1="658" x2="240" y2="658" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6,5"/>
    <text id="legend-dotted-text" x="248" y="663" font-size="14">what a check group reads</text>
    <rect id="legend-in" x="470" y="649" width="18" height="18" fill="#fff3f3" stroke="#1e1e1e"/>
    <text id="legend-in-text" x="494" y="663" font-size="14">input</text>
    <rect id="legend-check" x="550" y="649" width="18" height="18" fill="#ebfbee" stroke="#1e1e1e"/>
    <text id="legend-check-text" x="574" y="663" font-size="14">check group</text>
    <rect id="legend-read" x="675" y="649" width="18" height="18" fill="#fff9db" stroke="#1e1e1e"/>
    <text id="legend-read-text" x="699" y="663" font-size="14">source read</text>
    <rect id="legend-out" x="800" y="649" width="18" height="18" fill="#e7f5ff" stroke="#1e1e1e"/>
    <text id="legend-out-text" x="824" y="663" font-size="14">result and exits</text>
  </g>
</svg>
