[project]
name = "alienbio"
version = "0.1.0"
description = "Alien Biology: A framework for testing agentic AI reasoning through procedurally generated biological systems"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Dan Oblinger"}
]
keywords = ["ai", "testing", "biology", "agents", "reasoning"]

dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    # Not on PyPI: pinned to a pushed commit of https://github.com/oblinger/dvc-dat
    # (2.40.1). Bump the sha to take a newer dvc-dat; the gitignored
    # src/dvc_dat symlink to a local checkout is a dev convenience only.
    "dvc-dat @ git+https://github.com/oblinger/dvc-dat.git@c3dce2d5d717db6a09134133204fe36cda39a692",
]

[project.scripts]
bio = "alienbio.cli:main"

[project.optional-dependencies]
# M24 JAX simulator (vectorized/GPU-ready). Optional: without it the JAX/M24
# tests skip. Install with `uv sync --extra jax`.
jax = [
    "jax>=0.4",
]
# Live-model agent (suite.llm_agent.default_anthropic_llm_fn). Optional and
# never needed by CI: install with `uv sync --extra llm` before a paid run.
llm = [
    "anthropic>=0.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# dvc-dat is a git URL dependency; hatchling refuses a direct reference unless told.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/alienbio"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
extraPaths = ["src"]
exclude = ["src/dvc_dat"]   # vendored third-party library, not ours to type
reportUnsupportedDunderAll = "error"   # a name in __all__ that does not exist is a broken export

# The one dev list: a bare `uv sync` installs it, so `just test`, `just check`,
# `just lint` and `just docs` run after it. (A `dev` extra used to carry half of
# this beside the group; a bare sync missed hypothesis and the suite would not
# collect.) CI adds `--extra jax --extra llm`.
[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.1",
    "pyright>=1.1.407",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
    "mkdocs-awesome-pages-plugin>=2.9",
    "mkdocs-roamlinks-plugin>=0.3",
    "mkdocs-jupyter>=0.25",
    "ipykernel>=6.0",
    "nbconvert>=7.17.0",
    "nbformat>=5.10.4",
]

[tool.pytest.ini_options]
# A bare `pytest` / `uv run pytest` from anywhere in the repo collects what
# `pytest tests/` does. mkdocs_roamlinks_plugin installs a top-level `tests`
# package into site-packages that shadowed ours at collection
# (`ModuleNotFoundError: tests.capabilities`); importlib mode stops pytest
# resolving test modules through `sys.path`, and `pythonpath` puts the repo
# root first for the one `from tests.… import` a test module makes.
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]
markers = [
    "capability(id, ...): the end-to-end proof of a capability dimension (bio test-matrix)",
]
