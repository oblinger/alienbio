site_name: AlienBio Documentation
docs_dir: doc
site_description: Documentation for the AlienBio project
site_url: https://oblinger.github.io/abio-docs/
repo_url: https://github.com/oblinger/alienbio
use_directory_urls: false
exclude_docs: |
  _hooks/
  ABIO Ref/_template.md
  *Track/
  *Notebooks/
  .obsidian/
  website/
  ABIO Design/
  ABIO Idea/
  ABIO Dev Docs/
  ABIO.md
  ABIO Log.md
  ABIO Experiments.md
  ABIO Docs.md

# A link to a missing page, an unrecognized link or a site-absolute link is a
# warning, so `mkdocs build --strict` (CI) fails on it. mkdocs 1.6 logs a link
# to an `exclude_docs` page at INFO whatever this says, so
# doc/_hooks/dead_links.py warns on every dead href on the built site.
validation:
  links:
    not_found: warn
    unrecognized_links: warn
    absolute_links: warn

# Build-time page rewrites (doc/_hooks/strip_spine.py: the vault spine line,
# ha:// links, head links to excluded pages) and the built site's href check.
hooks:
  - doc/_hooks/strip_spine.py
  - doc/_hooks/dead_links.py

theme:
  name: material
  palette:
    # Light mode (default)
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  # Convert Obsidian-style [[wikilinks]] to standard markdown links
  - roamlinks
  - mkdocs-jupyter:
      include_source: true
      execute: false
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            heading_level: 2
            members_order: source
            docstring_style: google

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - toc:
      permalink: true
  - attr_list
  - md_in_html

nav:
  - Home: README.md
  - User Guide:
    - Overview: ABIO Guides/ABIO Alienbio User Guide.md
    - ABIO Expr Spec: ABIO Guides/ABIO Expr Spec.md
    - ABIO Expr Python API: ABIO Guides/ABIO Expr Python API.md
  - Demos:
    - Gallery: ABIO Demos/ABIO Demo Gallery.md
    - "01: Quick Start": ABIO Demos/notebooks/01_quick_start.ipynb
    - "03: Perturbation": ABIO Demos/notebooks/03_perturbation.ipynb
    - "04: Disease": ABIO Demos/notebooks/04_disease.ipynb
    - "05: Organism": ABIO Demos/notebooks/05_organism.ipynb
    - "06: Features": ABIO Demos/notebooks/06_features.ipynb
    - "07: Skinning": ABIO Demos/notebooks/07_skinning.ipynb
    - "08: Evaluation": ABIO Demos/notebooks/08_evaluation.ipynb
    - "Combo: Disease": ABIO Demos/notebooks/combo_disease_investigation.ipynb
    - "Combo: Alien Exam": ABIO Demos/notebooks/combo_alien_exam.ipynb
    - "Combo: Ecosystem": ABIO Demos/notebooks/combo_ecosystem.ipynb
  - Architecture:
    - Overview: ABIO Architecture/ABIO Architecture Docs.md
    - Data Model: ABIO Ref/ABIO Data.md
    - Files: ABIO Ref/ABIO Files.md
    - Infrastructure: ABIO Architecture/ABIO infra.md
    - Protocols: ABIO Ref/ABIO Protocols.md
    - Biology: ABIO Architecture/ABIO biology.md
    - Suite Construction: ABIO Architecture/ABIO Suite Construction.md
    - Suite Runtime: ABIO Architecture/ABIO Suite Runtime.md
  - Classes:
    - Biology:
      - Atom: ABIO Ref/ABIO Classes/ABIO Atom.md
      - Molecule: ABIO Ref/ABIO Classes/ABIO Molecule.md
      - Reaction: ABIO Ref/ABIO Classes/ABIO Reaction.md
      - Chemistry: ABIO Ref/ABIO Classes/ABIO Chemistry.md
      - Flow: ABIO Ref/ABIO Classes/ABIO Flow.md
      - WorldState: ABIO Ref/ABIO Classes/ABIO WorldState.md
      - WorldSimulator: ABIO Ref/ABIO Classes/ABIO WorldSimulator.md
      - Compartment: ABIO Ref/ABIO Classes/ABIO Compartment.md
      - CompartmentTree: ABIO Ref/ABIO Classes/ABIO CompartmentTree.md
    - Infrastructure:
      - Entity: ABIO Ref/ABIO Classes/ABIO entity.md
      - IO: ABIO Ref/ABIO Classes/ABIO IO.md
  - Commands: ABIO Ref/ABIO Commands.md
  - API Reference:
    - Overview: ABIO Ref/ABIO API/ABIO API.md
    - Bio: ABIO Ref/ABIO API/ABIO bio Module.md
    - Infra: ABIO Ref/ABIO API/ABIO infra Module.md
    - Protocols: ABIO Ref/ABIO API/ABIO protocols Module.md
    - Expr: ABIO Ref/ABIO API/ABIO expr Module.md
    - Suite: ABIO Ref/ABIO API/ABIO suite Module.md
    - Spec Language: ABIO Ref/ABIO API/ABIO spec_lang Module.md
    - CLI: ABIO Ref/ABIO API/ABIO cli Module.md
