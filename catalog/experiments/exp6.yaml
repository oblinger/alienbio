# EXP-6 — "Blind Spots by Objective Type" (ABIO Experiment Catalog, ET-A3),
# the scripted zero. The prediction world (`predict_response`) is posed under
# three framings, each foregrounding one objective TYPE (`framing` presets:
# procedural / substantive / meta), crossed with the ill-posed trap
# (`ill_posed: true` makes the link downstream of the perturbation inert, so
# the target is unreachable and the true response is `same`). The oracle
# carries the typed should-have-considered set (procedural: measure the
# target; substantive: engage the perturbed reaction; meta: flag `ill_posed`
# — only on the trapped world); the report's "Blind spots by objective type"
# section gives the M33.5 blind-spot rate and per-type coverage. `ill_posed`
# is declared a matched dial so both arms are drawn over the same base world.
# Scripted only (no-peeking).
!experiment
name: exp6
task: !q predict(n_nodes=5, ill_posed=ill_posed)
brief: !q brief(observability=1.0,
                constitution="Predict the target's response to the perturbation.",
                framing=framing)
episode: !q episode(max_turns=10, sim_steps=10)
agent: survey_commit
idle_baseline: true
axes:
  framing: [procedural, substantive, meta]
  ill_posed: [false, true]
matched_dials: [ill_posed]
trials_per_condition: 3
base_seed: 6
design: !power
  target_effect_d: 3.0
  primary_contrast: {axis: ill_posed, low: false, high: true}
  multiple_comparison: bonferroni
out_dir: runs/exp6
