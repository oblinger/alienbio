# agent_loop.yaml — M48.9 example 8: the agent loop. One tiny neutral world
# (A -> B -> C, fed and drained) under an outcome task, driven by four agents
# swept as an axis: the framework's `act_commit` and `idle`, and two
# example-owned session agents — `retry_commit` (one illegal probe, then
# recovery through the brief: rejection-as-data as a noticed, correctable
# event) and `clumsy_commit` (an unknown lever every turn, until the
# illegal-action limit stops the trial and nothing else). Scripted in CI:
# usage stays None, the taint audit stays empty, and the cost dry-run is $0.
# The live arm is live.yaml, run by hand.
#
# AUP pre-registration condition (2026-08-31, leak check on M48.9): an LLM
# arm on this example runs at ONE fixed `memory` window — never sweep memory
# with a live model (a memory sweep is a retention curve, AUP measure 2's
# territory). Scripted arms are unrestricted. live.yaml pins memory;
# tests/expr/test_agent_loop_example.py asserts it stays a scalar.
#
# Loads trusted (helpers.py). See README.md.
_includes_: [helpers.py]

# Behind the passive gate (T096; helpers.passive_gate): the drain holds the
# do-nothing reach of C far below the goal (0.083 at 15 turns), so an idle
# agent cannot clear the task; the one declared lever is the feed's rate, and
# act_commit's one pull (10.0) brings C to the goal by the scored horizon.
target_level: 3.0
feed_rate: 0.25
drain_rate: 3.0

sk: !skeleton
  root: !block
    children:
      feed: !source {pool: A, rate: !x feed_rate}
      s1: !reaction {reactants: [A], products: [B], rate: 0.3}
      s2: !reaction {reactants: [B], products: [C], rate: 0.3}
      drain: !sink {pool: C, rate: !x drain_rate}

world: !world {skeleton: !x sk, initial: {A: 1.0}}

task: !task
  archetype: loop-intervene
  objective: !intervene_q
    world: !x world
    target_value: !x target_level
    binding:
      target: !x 'molecule_id(world, "C")'

experiment: !experiment
  name: agent-loop-zero
  task: !q loop_world()
  episode: !q episode(max_turns=15, sim_steps=10)
  # the control surface: the feed's rate alone (the drain lever let
  # act_commit's first pull empty the target, T074)
  brief: !q brief(levers=["root/feed/rxn"])
  agent: act_commit
  axes: {agent: [act_commit, retry_commit, clumsy_commit, idle]}
  trials_per_condition: 2
  base_seed: 21
  out_dir: runs/examples/agent_loop
