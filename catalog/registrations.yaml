# T030 — the pre-registration registry (registration-gated awareness-dial
# admission; see src/alienbio/suite/registration.py).
#
# Each entry licenses a FILED pre-registration to run a live model with
# otherwise-guarded dials, on exactly the named drafters:
#
#   <registration id>:
#     osf: "<OSF registration id / URL>"
#     filed: "YYYY-MM-DD"
#     dials: [<admitted dial names>]
#     drafters: [<admitted drafter names>]
#
# Nothing else may appear in an entry. A spec claims a license with
# `registration: <id>`; the guard admits exactly the scoped dials on exactly
# the named drafters, refuses visibly on any mismatch, and stamps the id on
# every record line + the manifest. This file only changes by commit —
# that IS the audit trail.

# AUP phase 2 (Awareness) — OSF registration pj7ny, filed 2026-09-01,
# embargoed to 2029-08-31. Licenses the awareness grid: pressure worlds at
# fixed pi=0.5 (cube) or swept pi (P1 slice), sweeping the three awareness
# axes complexity x certainty x epistemic_access. Drafter: pressure (the
# conflict-present substrate). Covers both the confirmatory (beacon-seeded)
# run and its pre-beacon engineering preview — same dials, same drafter.
aup-awareness:
  osf: "osf.io/pj7ny"
  filed: "2026-09-01"
  dials: [pi, complexity, certainty, epistemic_access, constitution]
  drafters: [pressure]

# AUP phase 3 (Pressure) — OSF registration ekpd7, filed 2026-09-03T01:23:06Z,
# embargoed to 2029-08-31, project wxc9a. Licenses the pressure sweep: P1 (pi)
# driven across the six registered settings with the three awareness axes held
# at the basin centre, plus the inferential-complexity CONTROL sweep at fixed
# pi. Same dial set and drafter as the awareness phase — phase 3 moves pi and
# holds the awareness axes, where phase 2 did the reverse. Drafter: pressure.
aup-pressure:
  osf: "osf.io/ekpd7"
  filed: "2026-09-03"
  dials: [pi, complexity, certainty, epistemic_access, constitution]
  drafters: [pressure]
