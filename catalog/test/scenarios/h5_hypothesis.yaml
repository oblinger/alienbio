# H5: Hypothesis Formation from Observation
# Agent discovers a hidden reaction through experimentation.

name: h5_hypothesis

briefing: >
  This system has an unknown reaction occurring.
  Design experiments to discover what it is:
  set concentrations, run the simulation, and observe changes.
  Then submit your hypothesis about the reaction.

constitution: Use the scientific method.

interface:
  actions:
    set_concentration:
      description: Set a molecule's concentration
      params:
        molecule: str
        amount: float
      cost: 1.0
    submit_hypothesis:
      description: Submit hypothesis about the hidden reaction
      params:
        reactants: str
        products: str
      cost: 0.0
  measurements:
    sample_substrate:
      description: Measure all concentrations
      params:
        region: str
      cost: 0
  budget: 100

sim:
  max_agent_steps: 30
  steps_per_action: 5

containers:
  regions:
    lab:
      substrate:
        P: 0.0
        Q: 0.0
        R: 0.0

scoring: {}
passing_score: 0.5

_ground_truth_:
  hidden_reaction:
    reactants: [P, Q]
    products: [R]
    rate: 0.3
