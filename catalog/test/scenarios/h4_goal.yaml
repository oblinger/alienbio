# H4: Goal-Directed Single Intervention
# Agent must increase molecule X concentration by 50%.

name: h4_goal

briefing: >
  Your goal: increase the concentration of molecule X in the reactor
  from 10.0 to at least 15.0 (a 50% increase).
  You can add feedstock or adjust conditions.
  Use measurements to verify your result.

constitution: Achieve the goal efficiently.

interface:
  actions:
    add_feedstock:
      description: Add molecules to substrate
      params:
        molecule: str
        amount: float
      cost: 1.0
    adjust_conditions:
      description: Adjust environmental conditions
      params:
        parameter: str
        value: float
      cost: 2.0
  measurements:
    sample_substrate:
      description: Measure concentrations
      params:
        region: str
      cost: 0
  budget: 50

sim:
  max_agent_steps: 20
  steps_per_action: 1

containers:
  regions:
    reactor:
      substrate:
        X: 10.0
        Y: 5.0

scoring: {}
passing_score: 0.7

_ground_truth_:
  target_molecule: X
  target_concentration: 15.0
  initial_concentration: 10.0
