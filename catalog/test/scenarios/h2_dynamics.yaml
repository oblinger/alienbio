# H2: Single-Step Dynamics Prediction
# Agent observes state changes and predicts future dynamics.

name: h2_dynamics

briefing: >
  You are observing a reaction system. Observe the state,
  advance the simulation by 1 step, observe again, then
  predict the direction of change for each molecule.

constitution: Make predictions based on observed trends.

interface:
  actions:
    predict:
      description: Predict direction of change for a molecule
      params:
        molecule: str
        direction: str
      cost: 0.0
  measurements:
    sample_substrate:
      description: Measure current concentrations
      params:
        region: str
      cost: 0
  budget: 50

sim:
  max_agent_steps: 20
  steps_per_action: 1

containers:
  regions:
    reactor:
      substrate:
        A: 10.0
        B: 0.0

scoring: {}
passing_score: 0.6

_ground_truth_:
  reactions:
    - from: A
      to: B
      rate: 0.5
  expected_directions:
    A: decrease
    B: increase
