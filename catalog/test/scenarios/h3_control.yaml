# H3: Control Interface Exercise
# Agent follows explicit tool instructions step by step.

name: h3_control

briefing: |
  Follow these instructions exactly:
  1. Use sample_substrate to observe region 'main'
  2. Use add_feedstock with molecule='X' amount=5.0
  3. Use sample_substrate to observe region 'main' again
  4. Use submit_report with your observations

constitution: Follow instructions precisely.

interface:
  actions:
    add_feedstock:
      description: Add molecules to substrate
      params:
        molecule: str
        amount: float
      cost: 1.0
    submit_report:
      description: Submit a text report
      params:
        report: str
      cost: 0.0
  measurements:
    sample_substrate:
      description: Measure concentrations
      params:
        region: str
      cost: 0
  budget: 50

sim:
  max_agent_steps: 10
  steps_per_action: 1

containers:
  regions:
    main:
      substrate:
        X: 1.0
        Y: 2.0

scoring: {}
passing_score: 0.8

_ground_truth_:
  expected_sequence:
    - sample_substrate
    - add_feedstock
    - sample_substrate
    - submit_report
